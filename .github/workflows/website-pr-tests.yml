# Website-only lifecycle checks. No deployment or app build.
name: website-pr-tests
on:
  pull_request:
    branches: [website/dev, website/test, website/main]
    paths:
      - 'website/**'
      - '.github/release/**'
      - '.github/workflows/release-pointer-update.yml'
      - '.github/workflows/website-pr-tests.yml'
permissions:
  contents: read
concurrency:
  group: website-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  infrastructure-checks:
    name: Website infrastructure and static checks
    outputs:
      website_changed: ${{ steps.scope.outputs.website_changed }}
    # Evaluated before runner allocation: only the intended public
    # repository may run this job. The shell guard inside repeats the
    # check on the runner itself.
    if: >-
      github.event.repository.private == false &&
      github.repository == 'my-sochen/Start-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_REPOSITORY: my-sochen/Start-app
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ACTUAL_REPOSITORY: ${{ github.repository }}
      IS_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Require the intended public repository and candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [ "$IS_PRIVATE" = "false" ] || { echo 'Private or unknown repository: refusing paid fallback'; exit 1; }
          [ "$ACTUAL_REPOSITORY" = "$EXPECTED_REPOSITORY" ] || { echo 'Unexpected repository'; exit 1; }
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid head SHA'; exit 1; }
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ] || { echo 'Checkout/head mismatch'; exit 1; }
      - name: Reject software changes in website lifecycle
        id: scope
        shell: bash
        run: |
          python3 - <<'PYGUARD'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', os.environ['BASE_SHA'], os.environ['EXPECTED_HEAD']]).decode().split('\0')
          infra = {'.github/workflows/website-pr-tests.yml', '.github/workflows/release-pointer-update.yml', '.github/release/stage_website.py', '.github/release/update_pointer.py', '.github/release/website-live.json', '.github/release/WEBSITE-LIFECYCLE.md', '.github/release/tests/test_stage_website.py', '.github/release/tests/test_website_lifecycle.py', '.github/release/tests/test_release_pointer_workflow_static.py'}
          allowed = lambda p: p.startswith('website/') or p in infra
          rejected = [p for p in paths if p and not allowed(p)]
          if rejected: raise SystemExit('Software or unrelated files in website change: ' + repr(rejected))
          website_changed = any(p.startswith('website/') for p in paths if p)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('website_changed=' + str(website_changed).lower() + '\n')
          PYGUARD
      - name: Run offline publisher regression tests (isolated Python, no deploy)
        run: |
          python3 -m venv /tmp/website-publisher-tests
          /tmp/website-publisher-tests/bin/pip install PyYAML==6.0.2
          /tmp/website-publisher-tests/bin/python -m unittest discover -s .github/release/tests -v
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run offline website tests (no dependencies, no server)
        shell: bash
        run: |
          set -euo pipefail
          node website/tests/test-download-pointer.mjs
          node website/tests/test-download-catalog.mjs
          node website/tests/test-i18n.mjs
          node website/tests/test-meaning-corrections.mjs
          node website/tests/test-search-visibility.mjs
      - name: Record browser coverage boundary for infrastructure-only changes
        if: steps.scope.outputs.website_changed != 'true'
        run: |
          echo 'Website bytes unchanged: browser/locale harness NOT RUN. Publisher regression and static website suites ran; this is NOT website runtime qualification. Old live baseline has no npm lockfile; full browser coverage is required on the separate website-content PR.' >> "$GITHUB_STEP_SUMMARY"
  website-browser-full:
    name: Website full Chrome DOM and eight locales
    needs: infrastructure-checks
    if: >-
      github.event.repository.private == false &&
      github.repository == 'my-sochen/Start-app' &&
      needs.infrastructure-checks.outputs.website_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head (browser qualification)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind browser source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Node 22 for full browser coverage
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify Chrome binary and OpenSSL on the runner
        shell: bash
        run: |
          set -euo pipefail
          openssl version
          # Both harnesses default to /usr/bin/google-chrome (drive.mjs via
          # HARNESS_CHROME, test-locales.mjs hardcoded with port 8778). Use
          # exactly that default; no overrides, no port changes.
          [ -x /usr/bin/google-chrome ] || { echo 'Chrome not found at /usr/bin/google-chrome'; exit 1; }
          /usr/bin/google-chrome --version
      - name: Install pinned harness dependencies (requires committed lockfile)
        working-directory: website/tests/dom-harness
        run: npm ci
      - name: Run DOM behavior harness
        working-directory: website/tests/dom-harness
        run: node drive.mjs
      - name: Run locale harness (all 8 locales, default run)
        working-directory: website/tests/dom-harness
        run: node test-locales.mjs
