name: refactor-opening
on:
  push:
    branches: [refactor/opening-execution]
permissions:
  contents: read
jobs:
  opening-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Opening execution, cancellation, notifications and error ownership
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Presentation.Tests/StartApp.Presentation.Tests.csproj -c Release --filter "FullyQualifiedName~PreflightTests|FullyQualifiedName~OpeningHardeningTests|FullyQualifiedName~OpeningNotificationTests|FullyQualifiedName~UnexpectedErrorTests|FullyQualifiedName~MainViewModelTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Windows app without XAML changes
        shell: pwsh
        run: |
          dotnet build src/StartApp.App/StartApp.App.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
