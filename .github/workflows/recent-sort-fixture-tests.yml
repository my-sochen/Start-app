name: recent-sort-fixture-tests
on:
  push:
    branches: [fix/recent-sort-fixture]
permissions:
  contents: read
jobs:
  focused-repeat:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: View options fixture, focused repeated run
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Presentation.Tests/StartApp.Presentation.Tests.csproj -c Release --filter "FullyQualifiedName~ViewOptionsTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          1..20 | ForEach-Object {
            dotnet test tests/StartApp.Presentation.Tests/StartApp.Presentation.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~ViewOptionsTests"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
