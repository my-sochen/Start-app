# CI-only evidence run for PR #15 (open/launch candidate). Synthetic temp tree only. Nothing is launched except the harness exe itself in marker-only helper mode.
# The app here uses a CI-only composition whose process starter only records requests to a log. No browser, no network, no user programs, no script execution.
name: windows-open-launch
on:
  push:
    branches: [ci/smoke-open-launch]
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Unit tests on Windows (existing suites)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diag, out-images | Out-Null
          dotnet test StartApp.slnx 2>&1 | Tee-Object diag/windows-unit-tests.txt | Select-String 'Passed!|Failed!|error' 
          "unit-test exit code: $LASTEXITCODE" | Tee-Object -Append diag/windows-unit-tests.txt
          if ($LASTEXITCODE -ne 0) { "UNIT TESTS FAILED" | Tee-Object -Append diag/errors.txt }
        continue-on-error: true
      - name: Build harness and CI app
        shell: pwsh
        run: |
          dotnet build ci-harness/Harness.csproj --configuration Release 2>&1 | Tee-Object diag/build-harness.txt | Select-Object -Last 3
          dotnet build src/StartApp.App/StartApp.App.csproj --configuration Release 2>&1 | Tee-Object diag/build-app.txt | Select-Object -Last 3
      - name: Synthetic tree and harness
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'sa-tree'
          New-Item -ItemType Directory -Force $root, "$root\dir" | Out-Null
          foreach ($f in 'ok.txt','dir\inner.txt','slow-item.txt') { Set-Content -Path "$root\$f" -Value 'synthetic' }
          Set-Content "$root\run.ps1" 'Set-Content -Path (Join-Path $PSScriptRoot "EXECUTED-ps1.txt") -Value ran'
          Set-Content "$root\run.cmd" '@echo ran> "%~dp0EXECUTED-cmd.txt"'
          $helper = (Resolve-Path ci-harness/bin/Release/net10.0/Harness.exe).Path
          New-Item -ItemType SymbolicLink -Path "$root\link-file.txt" -Target "$root\ok.txt" | Out-Null
          New-Item -ItemType SymbolicLink -Path "$root\link-dir" -Target "$root\dir" | Out-Null
          New-Item -ItemType Junction -Path "$root\junc-dir" -Target "$root\dir" | Out-Null
          New-Item -ItemType SymbolicLink -Path "$root\link-helper.exe" -Target $helper | Out-Null
          Get-ChildItem $root -Force | Select-Object Name, Attributes, LinkType, Target | Format-Table -AutoSize | Out-String | Tee-Object diag/tree.txt
          & $helper $root 2>&1 | Tee-Object diag/harness-output.txt
          "harness exit code: $LASTEXITCODE" | Tee-Object -Append diag/harness-output.txt
          if ($LASTEXITCODE -ne 0) { "HARNESS FAILED" | Tee-Object -Append diag/errors.txt }
          "EXECUTED markers after the harness: " + ((Get-ChildItem $root -Filter 'EXECUTED-*' | ForEach-Object Name) -join ',') | Tee-Object -Append diag/harness-output.txt
          "ROOT=$root" | Out-File -Append $env:GITHUB_ENV
        continue-on-error: true
      - name: Panel and responsiveness run (CI composition, records only)
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class W { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r); }'
          $A = [System.Windows.Automation.AutomationElement]; $CT = [System.Windows.Automation.ControlType]; $PC = [System.Windows.Automation.PropertyCondition]; $TS = [System.Windows.Automation.TreeScope]
          $results = New-Object System.Collections.ArrayList; $script:shot = 0; $runId = $env:GITHUB_RUN_ID
          function Assert($name, $ok, $detail) { [void]$results.Add([ordered]@{ name = $name; ok = [bool]$ok; detail = "$detail" }); "ASSERT $(if ($ok) {'PASS'} else {'FAIL'}) $name :: $detail" }
          function Info($name, $detail) { [void]$results.Add([ordered]@{ name = $name; info = $true; detail = "$detail" }); "INFO $name :: $detail" }
          function Shot($state) {
            $script:shot++
            $f = "out-images/run$runId-openpanel-{0:00}-$state.png" -f $script:shot
            $r = New-Object W+R; [void][W]::GetWindowRect($p.MainWindowHandle, [ref]$r)
            $w = $r.Rt - $r.L; $h = $r.B - $r.T
            if ($w -le 0 -or $h -le 0) { "no window rect for $state" | Tee-Object -Append diag/errors.txt; return }
            $bmp = New-Object System.Drawing.Bitmap $w, $h; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size); $bmp.Save("$PWD/$f"); "shot $f ${w}x${h}"
          }
          function Texts() { @($win.FindAll($TS::Descendants, (New-Object $PC($A::ControlTypeProperty, $CT::Text))) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) }
          function ListLines() { @($win.FindAll($TS::Descendants, (New-Object $PC($A::ControlTypeProperty, $CT::ListItem))) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) }
          function Btn($name) { $win.FindFirst($TS::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object $PC($A::ControlTypeProperty, $CT::Button)), (New-Object $PC($A::NameProperty, $name))))) }
          function ClickBtn($name, $settle = 800) {
            $b = $null
            for ($i = 0; $i -lt 40; $i++) { $b = Btn $name; if ($b -and $b.Current.IsEnabled) { break }; Start-Sleep -Milliseconds 250 }
            if (-not $b) { return "button '$name' not found" }
            if (-not $b.Current.IsEnabled) { return "button '$name' stayed disabled" }
            $b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep -Milliseconds $settle; return 'ok'
          }
          function WaitText($needle, $secs) { $sw = [Diagnostics.Stopwatch]::StartNew(); while ($sw.Elapsed.TotalSeconds -lt $secs) { if (@(Texts) + @(ListLines) | Where-Object { $_ -like "*$needle*" }) { return $true }; Start-Sleep -Milliseconds 250 }; return $false }
          function Edits() { $win.FindAll($TS::Descendants, (New-Object $PC($A::ControlTypeProperty, $CT::Edit))) | Sort-Object { $_.Current.BoundingRectangle.X } }
          function SetText($edit, $text) { $edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($text); Start-Sleep -Milliseconds 400 }
          try {
            $root = $env:ROOT
            $env:STARTAPP_STORE_DIR = Join-Path $root 'ui-store'; $env:STARTAPP_CI_LOG = "$PWD/diag/launch-log.txt"; $env:STARTAPP_CI_LAUNCH_DELAY_MS = '1500'
            $exe = Get-ChildItem -Recurse src/StartApp.App/bin/Release -Filter StartApp.App.exe | Select-Object -First 1
            $p = Start-Process -FilePath $exe.FullName -PassThru
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ($sw.Elapsed.TotalSeconds -lt 60) { $p.Refresh(); if ($p.HasExited -or $p.MainWindowHandle -ne 0) { break }; Start-Sleep -Milliseconds 500 }
            Start-Sleep -Seconds 2
            Assert 'window opened' (-not $p.HasExited -and $p.MainWindowHandle -ne 0) "waited $([math]::Round($sw.Elapsed.TotalSeconds,1))s"
            $win = $A::RootElement.FindFirst($TS::Children, (New-Object $PC($A::ProcessIdProperty, $p.Id)))
            $edits = @(Edits); $nameBox = $edits[0]; $targetBox = $edits[1]
            SetText $nameBox 'Panel check workspace'; Assert 'create workspace' ((ClickBtn 'Create workspace') -eq 'ok') ''
            foreach ($t in 'ok.txt','nothing.txt','run.ps1','link-file.txt','slow-item.txt') { SetText $targetBox "$root\$t"; $r = ClickBtn 'Add' 400; Assert "add $t" ($r -eq 'ok') $r }
            Shot 'items-added'
            # --- Run 1: responsiveness while checking (slow-item check sleeps 2.5 s on a worker), decision panel, cancel during launch
            $b = Btn 'Open workspace'; $inv = [Diagnostics.Stopwatch]::StartNew()
            $b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); $invMs = $inv.ElapsedMilliseconds
            Assert 'Open invoke returned promptly (UI thread not blocked by the 2.5 s check)' ($invMs -lt 1000) "Invoke took $invMs ms"
            $lat = @(); for ($i = 0; $i -lt 5; $i++) { $m = [Diagnostics.Stopwatch]::StartNew(); [void](Texts); $lat += $m.ElapsedMilliseconds; Start-Sleep -Milliseconds 100 }
            $statusNow = (Texts) -join ' | '
            $ob = Btn 'Open workspace'
            Assert 'UI answers automation while checking' (($lat | Measure-Object -Maximum).Maximum -lt 1500) "UIA read latencies ms: $($lat -join ',')"
            Assert 'status shows checking and Open is disabled meanwhile' (($statusNow -like '*Checking items*') -and (-not $ob.Current.IsEnabled)) "texts: $statusNow; Open enabled=$($ob.Current.IsEnabled)"
            $cancelVisible = $null -ne (Btn 'Cancel'); Assert 'Cancel is reachable while checking' $cancelVisible ''
            Shot 'checking'
            Assert 'decision panel appears' (WaitText 'need your decision' 25) ((Texts) -join ' | ')
            Start-Sleep -Milliseconds 500
            Shot 'decision-panel'
            Info 'decision status' ((Texts) -join ' | ')
            Info 'decision list lines (UIA, full text)' ((ListLines) -join ' || ')
            Assert 'nothing launched before the user decides' (-not (Test-Path diag/launch-log.txt)) ''
            Assert 'Open anyway and Cancel present' ((Btn 'Open anyway') -and (Btn 'Cancel')) ''
            foreach ($n in 'Open anyway','Cancel') { $bb = Btn $n; if ($bb) { $r = $bb.Current.BoundingRectangle; $wr = New-Object W+R; [void][W]::GetWindowRect($p.MainWindowHandle, [ref]$wr); Assert "button '$n' inside window" (($r.X -ge $wr.L) -and ($r.X + $r.Width -le $wr.Rt) -and ($r.Y -ge $wr.T) -and ($r.Y + $r.Height -le $wr.B)) "x=$([int]$r.X) y=$([int]$r.Y) w=$([int]$r.Width) h=$([int]$r.Height) window r=$($wr.Rt) b=$($wr.B)" } }
            [void](ClickBtn 'Open anyway' 1300)
            $cancelDuringLaunch = Btn 'Cancel'
            Assert 'Cancel is visible and enabled while launching (panel stays open)' ($cancelDuringLaunch -and $cancelDuringLaunch.Current.IsEnabled) "texts: $((Texts) -join ' | ')"
            Shot 'launching-cancel-reachable'
            [void](ClickBtn 'Cancel' 500)
            Assert 'report after cancel mentions not attempted' (WaitText 'not attempted (cancelled' 15) ((Texts) -join ' | ')
            Start-Sleep -Milliseconds 500
            Shot 'report-after-cancel'
            Info 'report lines after cancel' ((ListLines) -join ' || ')
            Info 'status after cancel' ((Texts) -join ' | ')
            $log1 = if (Test-Path diag/launch-log.txt) { @(Get-Content diag/launch-log.txt) } else { @() }
            Info 'recorded launch requests after run 1 (nothing was started)' ($log1 -join ' || ')
            Assert 'run 1 recorded only ok.txt and nothing.txt (cancel stopped the rest, blocked items never reached the starter)' (($log1.Count -eq 2) -and (($log1 -join ' ') -notmatch 'run.ps1|link-file|slow-item')) "count=$($log1.Count)"
            # --- Run 2: complete without cancel
            Assert 'second Open' ((ClickBtn 'Open workspace' 300) -eq 'ok') ''
            Assert 'decision panel again' (WaitText 'need your decision' 25) ''
            [void](ClickBtn 'Open anyway' 300)
            Assert 'complete report' (WaitText 'Open requests sent for' 25) ((Texts) -join ' | ')
            Start-Sleep -Milliseconds 500
            Shot 'report-complete'
            Info 'report lines (complete run)' ((ListLines) -join ' || ')
            Info 'status (complete run)' ((Texts) -join ' | ')
            $log2 = @(Get-Content diag/launch-log.txt)
            Info 'recorded launch requests after run 2 (nothing was started)' ($log2 -join ' || ')
            Assert 'run 2 recorded ok.txt, nothing.txt, slow-item.txt added; run.ps1 and link-file never reached the starter' (($log2.Count -eq 5) -and (($log2[2..4] -join ' ') -notmatch 'run.ps1|link-file')) "count=$($log2.Count)"
            Assert 'no EXECUTED marker' (-not (Test-Path "$root\EXECUTED-*")) ''
          }
          catch { "script error: $_" | Tee-Object -Append diag/errors.txt; [void]$results.Add([ordered]@{ name = 'script error'; ok = $false; detail = "$_" }) }
          finally {
            $results | ConvertTo-Json -Depth 4 | Out-File diag/assertions.json
            if ($p -and -not $p.HasExited) { $null = $p.CloseMainWindow(); Start-Sleep 3; if (-not $p.HasExited) { $p.Kill() } }
          }
          if (@($results | Where-Object { $_.ok -eq $false }).Count -gt 0) { 'UI ASSERTIONS FAILED' | Out-File -Append diag/errors.txt; exit 1 }
        continue-on-error: true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-openpanel-01-items-added.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-openpanel-02-checking.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-openpanel-03-decision-panel.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-openpanel-04-launching-cancel-reachable.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-openpanel-05-report-after-cancel.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-openpanel-06-report-complete.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diagnostics-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: diag/
          if-no-files-found: warn
      - name: Fail the job if anything failed
        if: always()
        shell: pwsh
        run: |
          if (Test-Path diag/errors.txt) { Get-Content diag/errors.txt; exit 1 }
