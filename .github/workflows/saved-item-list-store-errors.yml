name: saved-item-list-store-errors
on:
  push:
    branches: [fix/saved-item-list-store-errors]
permissions:
  contents: read
jobs:
  focused-store-error-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Build actual WPF app
        run: dotnet build src/StartApp.App/StartApp.App.csproj -c Release
      - name: Saved transfer and affected item list regressions
        run: dotnet test tests/StartApp.Presentation.Tests/StartApp.Presentation.Tests.csproj -c Release --filter "FullyQualifiedName~SavedItemTransferTests|FullyQualifiedName~GlobalEnvTests|FullyQualifiedName~ItemRowActionsTests|FullyQualifiedName~StagedItemActionsTests"
