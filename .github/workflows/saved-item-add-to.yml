name: saved-item-add-to
on:
  push:
    branches: [feat/saved-item-add-to]
permissions:
  contents: read
jobs:
  runtime-review:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Build review fixes
        shell: pwsh
        run: |
          dotnet build src/StartApp.App/StartApp.App.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused tests
        shell: pwsh
        run: dotnet test tests/StartApp.Presentation.Tests/StartApp.Presentation.Tests.csproj -c Release --filter "FullyQualifiedName~SavedItemTransferTests|FullyQualifiedName~ReviewInputTests|FullyQualifiedName~GlobalEnvTests|FullyQualifiedName~ItemRowActionsTests|FullyQualifiedName~StagedItemActionsTests"
      - name: Adversarial product behavior review, synthetic data only
        shell: pwsh
        run: ./.github/e2e/saved-item-add-to.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: saved-item-add-to-evidence
          path: product-review/
          retention-days: 7
