name: refactor-main-window-feature-views
on:
  push:
    branches: [refactor/main-window-feature-views]
permissions:
  contents: read
jobs:
  dialog-coverage-and-capture:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4ba497853f6e319ac6e05b527e27ada13a3deb7b
          path: baseline
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Full solution test suite
        run: dotnet test StartApp.slnx -c Release --logger 'trx;LogFilePrefix=integration'
      - name: Direct WPF session tests
        run: dotnet test tests/StartApp.App.Session.Tests -c Release
      - name: Build actual WPF app
        run: dotnet build src/StartApp.App -c Release
      - name: Native store error regressions
        shell: pwsh
        run: |
          dotnet build tests/StartApp.StoreErrorUiCapture -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $binary=Join-Path $PWD 'tests/StartApp.StoreErrorUiCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe'
          $output=Join-Path $PWD 'store-error-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'"') -PassThru
          if(-not $p.WaitForExit(90000)){$p.Kill($true);throw 'Store fixture timeout'}
          if($p.ExitCode -ne 0){Get-Content "$output/error.txt";throw 'Store fixture failed'}
      - name: Real application screenshots for owner review
        shell: pwsh
        run: |
          dotnet build tests/StartApp.UserReviewCapture -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $binary=Join-Path $PWD 'tests/StartApp.UserReviewCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe'
          $output=Join-Path $PWD 'user-review-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'" feature-views-20261124') -PassThru
          if(-not $p.WaitForExit(90000)){$p.Kill($true);throw 'Screenshot timeout'}
          if($p.ExitCode -ne 0){Get-Content "$output/error.txt";throw 'Screenshot failed'}
      - name: Identical harness against before and after product XAML
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          if(Test-Path baseline/tests/StartApp.CaptureRefactorCapture){Remove-Item baseline/tests/StartApp.CaptureRefactorCapture -Recurse -Force}
          Copy-Item tests/StartApp.CaptureRefactorCapture baseline/tests/StartApp.CaptureRefactorCapture -Recurse
          foreach ($variant in @('before','before-repeat','after')) {
            $root = if ($variant -ne 'after') { 'baseline' } else { '.' }
            $project = Join-Path $root 'tests/StartApp.CaptureRefactorCapture/StartApp.CaptureRefactorCapture.csproj'
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $binary = Join-Path $PWD (Join-Path $root 'tests/StartApp.CaptureRefactorCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe')
            $output = Join-Path $PWD "evidence/$variant"
            $p=Start-Process $binary -ArgumentList ('"'+$output+'"') -PassThru
            if (-not $p.WaitForExit(90000)) { $p.Kill($true); throw "$variant timeout" }
            if ($p.ExitCode -ne 0) { Get-Content "$output/error.txt"; throw "$variant capture failed" }
          }
      - name: Exact pixel and behavior comparison
        shell: pwsh
        run: |
          python -m pip install pillow
          python .github/e2e/compare-capture-refactor.py
      - name: Enabled and disabled shared button variants
        if: always()
        shell: pwsh
        run: |
          if(Test-Path baseline/tests/StartApp.ButtonRefactorCapture){Remove-Item baseline/tests/StartApp.ButtonRefactorCapture -Recurse -Force}
          Copy-Item tests/StartApp.ButtonRefactorCapture baseline/tests/StartApp.ButtonRefactorCapture -Recurse
          foreach ($variant in @('before','before-repeat','after')) {
            $root = if ($variant -eq 'after') { '.' } else { 'baseline' }
            $project=Join-Path $root 'tests/StartApp.ButtonRefactorCapture/StartApp.ButtonRefactorCapture.csproj'
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $binary=Join-Path $PWD (Join-Path $root 'tests/StartApp.ButtonRefactorCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe')
            $output=Join-Path $PWD "evidence/buttons-$variant"
            $p=Start-Process $binary -ArgumentList ('"'+$output+'"') -PassThru
            if (-not $p.WaitForExit(90000)) { $p.Kill($true); throw "$variant timeout" }
            if ($p.ExitCode -ne 0) { Get-Content "$output/error.txt"; throw "$variant button capture failed" }
          }
          python .github/e2e/compare-button-refactor.py
      - name: Actual dev baseline menu comparison
        if: always()
        shell: pwsh
        run: |
          if(Test-Path baseline/tests/StartApp.MenuRefactorCapture){Remove-Item baseline/tests/StartApp.MenuRefactorCapture -Recurse -Force}
          Copy-Item tests/StartApp.MenuRefactorCapture baseline/tests/StartApp.MenuRefactorCapture -Recurse
          foreach($variant in @('before','before-repeat','after')) {
            $root=if($variant -eq 'after'){'.'}else{'baseline'}
            dotnet build "$root/tests/StartApp.MenuRefactorCapture" -c Release
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            $binary=Join-Path $PWD "$root/tests/StartApp.MenuRefactorCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe"
            $output=Join-Path $PWD "evidence/menus/$variant"
            $p=Start-Process $binary -ArgumentList ('"'+$output+'"') -PassThru
            if(-not $p.WaitForExit(90000)){$p.Kill($true);throw 'Menu timeout'}
            if($p.ExitCode -ne 0){Get-Content "$output/error.txt";throw 'Menu fixture failed'}
          }
          python .github/e2e/compare-menu-refactor.py evidence/menus
      - name: Feature views real keyboard focus and exact destination pixels
        if: always()
        shell: pwsh
        run: |
          if(Test-Path baseline/tests/StartApp.FeatureViewCapture){Remove-Item baseline/tests/StartApp.FeatureViewCapture -Recurse -Force}
          Copy-Item tests/StartApp.FeatureViewCapture baseline/tests/StartApp.FeatureViewCapture -Recurse
          foreach($variant in @('before','before-repeat','after')) {
            $root=if($variant -eq 'after'){'.'}else{'baseline'}
            dotnet build "$root/tests/StartApp.FeatureViewCapture" -c Release
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            $binary=Join-Path $PWD "$root/tests/StartApp.FeatureViewCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe"
            $output=Join-Path $PWD "evidence/feature-views/$variant"
            $p=Start-Process $binary -ArgumentList ('"'+$output+'"') -PassThru
            if(-not $p.WaitForExit(90000)){$p.Kill($true);throw 'Feature view timeout'}
            if($p.ExitCode -ne 0){Get-Content "$output/error.txt";throw 'Feature view fixture failed'}
          }
          python .github/e2e/compare-feature-views.py
      - name: Window overlay and extracted source contracts
        if: always()
        run: python tests/update-notifier/test_overlay_rows.py
      - name: Collect owner review and store evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          if(Test-Path user-review-evidence){Copy-Item user-review-evidence evidence/user-review -Recurse}
          if(Test-Path store-error-evidence){Copy-Item store-error-evidence evidence/store-errors -Recurse}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: capture-refactor-before-after
          path: evidence/
          retention-days: 7
