name: uia-capability-probe
on:
  push:
    branches: [diag/uia-document-capability]
permissions:
  contents: read
concurrency:
  group: uia-document-capability-single
  cancel-in-progress: false
jobs:
  diagnostic-only:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Bind source and parse diagnostic harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diag | Out-Null
          $actual = git rev-parse HEAD
          if ($actual -ne $env:GITHUB_SHA) { throw 'SHA mismatch' }
          $tree = git rev-parse 'HEAD^{tree}'
          "sha=$actual`ntree=$tree`nrun=$env:GITHUB_RUN_ID`nattempt=$env:GITHUB_RUN_ATTEMPT`nscope=standalone synthetic UIA capability; product unchanged" | Out-File diag/source-binding.txt
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .github/e2e/uia-capability-probe.ps1).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'PowerShell parse failure' }
      - name: Build standalone probe only
        shell: pwsh
        run: |
          dotnet build tests/StartApp.UiaCapabilityProbe --configuration Release 2>&1 | Tee-Object diag/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One fixed synthetic native sample pass
        shell: pwsh
        run: pwsh -NoProfile -File .github/e2e/uia-capability-probe.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: uia-capability-evidence
          path: diag/
          if-no-files-found: error
