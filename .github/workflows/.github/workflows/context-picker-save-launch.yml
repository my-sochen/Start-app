name: context-picker-save-launch
on:
  push:
    branches: [test/context-picker-save-launch]
permissions:
  contents: write
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply test-only context regression coverage
        shell: pwsh
        run: |
          if($env:GITHUB_REF -ne 'refs/heads/test/context-picker-save-launch'){throw 'Wrong branch'}
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'coverage.patch'),[Convert]::FromBase64String(''))
          git apply --index (Join-Path $env:RUNNER_TEMP 'coverage.patch')
          if($LASTEXITCODE -ne 0){throw 'Patch failed'}
          git config user.name 'my-sochen'
          git config user.email 'my-sochen@users.noreply.github.com'
          git commit -m 'Cover context dropdown save launch reopen row and Escape'
          if($LASTEXITCODE -ne 0){throw 'Commit failed'}
          git push origin HEAD:refs/heads/test/context-picker-save-launch
          if($LASTEXITCODE -ne 0){throw 'Push failed'}
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Affected presentation contracts
        run: dotnet test tests/StartApp.Presentation.Tests -c Release --filter 'FullyQualifiedName~SharedFieldStyleTests|FullyQualifiedName~ItemPopupsTests|FullyQualifiedName~StagedItemActionsTests'
      - name: Native edge checks and visual evidence
        shell: pwsh
        run: |
          dotnet build tests/StartApp.FieldStyleCapture -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $binary=Join-Path $PWD 'tests/StartApp.FieldStyleCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe'
          $output=Join-Path $PWD 'focused-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'" context') -PassThru
          if(-not $p.WaitForExit(120000)){$p.Kill($true);throw 'Fixture timeout'}
          if($p.ExitCode -ne 0){Get-Content "$output/error.txt";throw 'Native checks failed'}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: context-picker-save-launch-evidence
          path: focused-evidence/
          retention-days: 5
