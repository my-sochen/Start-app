name: hebrew-opener
on:
  push:
    branches: [fix/hebrew-opener-label]
permissions:
  contents: write
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Integrate latest approved count fix from dev
        shell: pwsh
        run: |
          if($env:GITHUB_REF -ne 'refs/heads/fix/hebrew-opener-label'){throw 'Wrong branch'}
          git config user.name 'my-sochen'
          git config user.email 'my-sochen@users.noreply.github.com'
          git merge --no-edit -X theirs b44b15c
          if($LASTEXITCODE -ne 0){throw 'Integration failed'}
          [IO.File]::WriteAllBytes((Join-Path $PWD 'tests/StartApp.FieldStyleCapture/Program.cs'),[Convert]::FromBase64String(''))
          git add tests/StartApp.FieldStyleCapture/Program.cs
          git commit -m 'Preserve Hebrew fixture alongside count and context modes'
          if($LASTEXITCODE -ne 0){throw 'Fixture commit failed'}
          git push origin HEAD:refs/heads/fix/hebrew-opener-label
          if($LASTEXITCODE -ne 0){throw 'Push failed'}
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Affected presentation contracts
        run: dotnet test tests/StartApp.Presentation.Tests -c Release --filter 'FullyQualifiedName~ProgramIconLabelSourceTests'
      - name: Native edge checks and visual evidence
        shell: pwsh
        run: |
          dotnet build tests/StartApp.FieldStyleCapture -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $binary=Join-Path $PWD 'tests/StartApp.FieldStyleCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe'
          $output=Join-Path $PWD 'focused-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'" hebrew') -PassThru
          if(-not $p.WaitForExit(120000)){$p.Kill($true);throw 'Fixture timeout'}
          if($p.ExitCode -ne 0){Get-Content "$output/error.txt";throw 'Native checks failed'}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hebrew-opener-evidence
          path: focused-evidence/
          retention-days: 5
