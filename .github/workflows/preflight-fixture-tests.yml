name: preflight-fixture-tests
on:
  push:
    branches: [fix/preflight-stored-fixtures]
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Preflight defense and strict input regressions only
        shell: pwsh
        run: dotnet test tests/StartApp.Presentation.Tests/StartApp.Presentation.Tests.csproj -c Release --filter "FullyQualifiedName~PreflightTests|FullyQualifiedName~ReviewInputTests"
