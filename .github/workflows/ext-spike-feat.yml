name: ext-spike-feat
on:
  push:
    branches: [feat/per-instance-items]
    paths: [ext-trigger-feat.txt]
jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: run extension+native-host spike
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ext-spike-out | Out-Null
          pwsh -File .github/e2e/ext-spike.ps1 -OutDir ext-spike-out
          Get-Content ext-spike-out/ext-spike-log.txt
      - name: upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ext-spike-${{ github.sha }}
          path: ext-spike-out/
