name: context-picker-save-launch
on:
  push:
    branches: [test/context-picker-save-launch]
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Affected presentation contracts
        run: dotnet test tests/StartApp.Presentation.Tests -c Release --filter 'FullyQualifiedName~SharedFieldStyleTests|FullyQualifiedName~ItemPopupsTests|FullyQualifiedName~StagedItemActionsTests'
      - name: Native edge checks and visual evidence
        shell: pwsh
        run: |
          dotnet build tests/StartApp.FieldStyleCapture -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $binary=Join-Path $PWD 'tests/StartApp.FieldStyleCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe'
          $output=Join-Path $PWD 'focused-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'" context') -PassThru
          if(-not $p.WaitForExit(120000)){$p.Kill($true);throw 'Fixture timeout'}
          if($p.ExitCode -ne 0){Get-Content "$output/error.txt";throw 'Native checks failed'}
          $hebrew=Join-Path $PWD 'hebrew-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$hebrew+'" hebrew') -PassThru
          if(-not $p.WaitForExit(120000)){$p.Kill($true);throw 'Hebrew fixture timeout'}
          if($p.ExitCode -ne 0){Get-Content "$hebrew/error.txt";throw 'Hebrew native checks failed'}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: context-picker-save-launch-evidence
          path: |
            focused-evidence/
            hebrew-evidence/
          retention-days: 5
