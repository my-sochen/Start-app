name: beta-advanced-colors
on:
  push:
    branches: [feat/advanced-color-picker, fix/theme-blue-workspace-default]
permissions:
  contents: read
jobs:
  colors:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Targeted color contracts
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/StartApp.Presentation.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/StartApp.Storage.Json.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scripts = @('workspace-colors.ps1','capture-flow.ps1','cycle1-flow.ps1','tabs-only-flow.ps1','design-captures.ps1','workspace-colors-smoke.ps1')
          foreach ($script in $scripts) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ".github/e2e/$script"),[ref]$tokens,[ref]$errors)
            if($errors.Count) { $errors | Format-List; throw "Parse failed: $script" }
          }
      - name: Windows color picker entry points
        shell: pwsh
        run: |
          dotnet build tests/StartApp.ColorCapture -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary=Join-Path $PWD 'tests/StartApp.ColorCapture/bin/Release/net10.0-windows/StartApp.ColorCapture.exe'
          $output=Join-Path $PWD 'color-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'" --theme-default') -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill($true); throw 'Color capture timeout' }
          if ($p.ExitCode -ne 0) { Get-Content "$output/error.txt"; throw 'Color capture failed' }
      - name: Actual UIA consumer helper smoke
        shell: pwsh
        run: ./.github/e2e/workspace-colors-smoke.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: color-evidence
          path: |
            color-evidence/
            color-uia-evidence/checks.json
          retention-days: 7
