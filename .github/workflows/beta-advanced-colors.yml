name: beta-advanced-colors
on:
  push:
    branches: [feat/advanced-color-picker]
permissions:
  contents: read
jobs:
  colors:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Targeted color contracts
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Presentation.Tests -c Release --filter "FullyQualifiedName~AdvancedColorTests|FullyQualifiedName~WorkspaceCardTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/StartApp.Storage.Json.Tests -c Release --filter "FullyQualifiedName~AdvancedColorStorageTests|FullyQualifiedName~Schema4Tests|FullyQualifiedName~CategoryUpgradeTests|FullyQualifiedName~DescriptionStorageTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows color picker entry points
        shell: pwsh
        run: |
          dotnet build tests/StartApp.ColorCapture -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary=Join-Path $PWD 'tests/StartApp.ColorCapture/bin/Release/net10.0-windows/StartApp.ColorCapture.exe'
          $output=Join-Path $PWD 'color-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'"') -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill($true); throw 'Color capture timeout' }
          if ($p.ExitCode -ne 0) { Get-Content "$output/error.txt"; throw 'Color capture failed' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: color-evidence
          path: color-evidence/
          retention-days: 7
