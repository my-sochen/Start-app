name: design-captures
on:
  push:
    branches: [feat/settings-tab]
    paths:
      - 'src/StartApp.App/**'
      - '.github/e2e/design-captures.ps1'
      - '.github/workflows/design-captures.yml'
permissions:
  contents: read
jobs:
  captures:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Build running app
        run: dotnet build src/StartApp.App/StartApp.App.csproj --configuration Release
      - name: Capture app at mock size and minimum review size
        shell: pwsh
        run: ./.github/e2e/design-captures.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: running-app-design-captures
          path: design-captures/
