name: windows-open-flow-feat
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Parse-check E2E scripts (real PowerShell parser, before any UI run)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force diag, out-images | Out-Null
        $bad = $false
        foreach ($f in '.github/e2e/cycle1-flow.ps1', '.github/e2e/capture-flow.ps1') {
          $tokens = $null; $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $bad = $true
            "PARSE ERRORS in ${f}:" | Tee-Object -Append diag/errors.txt
            $errs | ForEach-Object { "  line $($_.Extent.StartLineNumber): $($_.Message)" | Tee-Object -Append diag/errors.txt }
          } else { "parse OK: $f" }
        }
        if ($bad) { exit 1 }
    - name: Build normal App
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force diag, out-images | Out-Null
        dotnet build src/StartApp.App/StartApp.App.csproj --configuration Release 2>&1 | Tee-Object diag/build-app.txt | Select-Object -Last 3
    - name: All unit tests (Windows, whole solution)
      shell: pwsh
      run: |
        dotnet test StartApp.slnx --configuration Release 2>&1 | Tee-Object diag/test-all.txt | Select-String 'Passed!|Failed!|error|Failed |Error Message|Stack Trace' | ForEach-Object { $_.Line }
        if ($LASTEXITCODE -ne 0) { 'SOLUTION TESTS FAILED' | Out-File -Append diag/errors.txt }
    - name: Cycle-1 flow UI run (create, details, add, duplicates, edit guard, empty dialog, open)
      shell: pwsh
      run: pwsh -NoProfile -File .github/e2e/cycle1-flow.ps1
      continue-on-error: true
    - name: Capture flow UI run (real scan of Notepad/Explorer windows, new + existing workspace, staging, duplicates, guards, rescan)
      shell: pwsh
      run: pwsh -NoProfile -File .github/e2e/capture-flow.ps1
      continue-on-error: true
    - uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: shot-cap-new-form-with-scan
        path: out-images/cap-new-form-with-scan.png
        if-no-files-found: warn
        archive: false
