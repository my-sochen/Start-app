    - uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: diagnostics-open-flow-feat-${{ github.run_id }}-${{ github.run_attempt }}
        path: diag/
        if-no-files-found: warn
    - name: Fail the job if anything failed
      if: always()
      shell: pwsh
      run: |
        if (-not (Test-Path diag/assertions.json)) { 'E2E step never produced assertions.json - it failed before completing; its step log has the cause' | Out-File -Append diag/errors.txt }
        else {
          $a = Get-Content diag/assertions.json | ConvertFrom-Json
          if (-not $a) { 'assertions.json is empty - E2E ran no checks' | Out-File -Append diag/errors.txt }
          else {
            if (@($a | Where-Object { $_.PSObject.Properties['ok'] -and -not $_.ok }).Count -gt 0) { 'assertions.json contains FAIL asserts' | Out-File -Append diag/errors.txt }
            $last = @($a)[-1]
            if ($last.name -ne 'FLOW-COMPLETE' -or -not $last.ok) { 'E2E flow stopped before its end-of-flow completion marker - partial run treated as failure' | Out-File -Append diag/errors.txt }
            elseif ($last.detail -ne '${{ github.sha }}') { "completion marker commit $($last.detail) does not match run commit ${{ github.sha }}" | Out-File -Append diag/errors.txt }
          }
        }
        if (-not (Test-Path diag/capture-assertions.json)) { 'Capture step never produced capture-assertions.json - it failed before completing; its step log has the cause' | Out-File -Append diag/errors.txt }
        else {
          $ca = Get-Content diag/capture-assertions.json | ConvertFrom-Json
          if (-not $ca) { 'capture-assertions.json is empty - capture flow ran no checks' | Out-File -Append diag/errors.txt }
          else {
            if (@($ca | Where-Object { $_.PSObject.Properties['ok'] -and -not $_.ok }).Count -gt 0) { 'capture-assertions.json contains FAIL asserts' | Out-File -Append diag/errors.txt }
            $clast = @($ca)[-1]
            if ($clast.name -ne 'FLOW-COMPLETE' -or -not $clast.ok) { 'capture flow stopped before its completion marker - partial run treated as failure' | Out-File -Append diag/errors.txt }
            elseif ($clast.detail -ne '${{ github.sha }}') { "capture completion marker commit $($clast.detail) does not match run commit ${{ github.sha }}" | Out-File -Append diag/errors.txt }
          }
        }
        if (Test-Path diag/errors.txt) { Get-Content diag/errors.txt; exit 1 }
'on':
  push:
    branches:
    - feat/per-instance-items
    paths:
    - ci-trigger-feat.txt
