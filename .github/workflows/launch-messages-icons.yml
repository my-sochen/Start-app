# Feature-only validation. No deployment, release, pointer or promotion actions.
name: launch-messages-icons
on:
  push:
    branches: [feat/launch-messages-icons]
permissions:
  contents: read
concurrency:
  group: launch-messages-icons-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Whole solution unit tests
        shell: pwsh
        run: |
          dotnet test StartApp.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual WPF launch-message UI capture and assertions
        shell: pwsh
        run: |
          dotnet run --project tests/StartApp.OpeningUiCapture --configuration Release -- out-opening-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing product and capture UI regression gates
        shell: pwsh
        run: |
          dotnet build src/StartApp.App --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force diag, out-images | Out-Null
          pwsh -NoProfile -File .github/e2e/cycle1-flow.ps1
          $cycle = $LASTEXITCODE
          pwsh -NoProfile -File .github/e2e/capture-flow.ps1
          if ($cycle -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: launch-flow-evidence
          path: |
            out-opening-ui/
            diag/
            out-images/
          if-no-files-found: error
