# Feature-only validation. No deployment, release, pointer or promotion actions.
name: launch-messages-icons
on:
  push:
    branches: [feat/launch-messages-icons]
permissions:
  contents: read
concurrency:
  group: launch-messages-icons-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Parse focused tab reproduction script
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.github/e2e/tabs-only-flow.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Build and reproduce initial and post-discard tab scans only
        shell: pwsh
        run: |
          dotnet build src/StartApp.App --configuration Release -p:DefineConstants=STARTAPP_CAPTURE_TRACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force diag, out-images | Out-Null
          pwsh -NoProfile -File .github/e2e/tabs-only-flow.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: launch-flow-evidence
          path: |
            diag/
            out-images/
          if-no-files-found: error
