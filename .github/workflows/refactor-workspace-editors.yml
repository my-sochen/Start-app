name: refactor-workspace-editors
on:
  push:
    branches: [refactor/workspace-editors]
permissions:
  contents: read
jobs:
  workspace-editor-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Card design, category manager, resource picker and guards
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Presentation.Tests/StartApp.Presentation.Tests.csproj -c Release --filter "FullyQualifiedName~Category|FullyQualifiedName~Design|FullyQualifiedName~Picker|FullyQualifiedName~CreateForm|FullyQualifiedName~DetailsViewModelTests|FullyQualifiedName~ViewSourceIntegrityTests|FullyQualifiedName~CommandNotificationTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Windows app without XAML changes
        shell: pwsh
        run: |
          dotnet build src/StartApp.App/StartApp.App.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
