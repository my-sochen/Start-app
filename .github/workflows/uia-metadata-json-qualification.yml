name: Prospective UIA metadata and synthetic JSON qualification
'on':
  push:
    branches: ['diag/uia-metadata-json-q1']
    paths:
      - '.github/workflows/uia-metadata-json-qualification.yml'
      - 'qualification/uia-metadata-json/**'
permissions:
  contents: read
concurrency:
  group: uia-metadata-json-q1
  cancel-in-progress: false
jobs:
  qualify:
    # Public standard hosted Windows runner only. No paid/private execution or reruns.
    if: github.repository == 'my-sochen/Start-app' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/diag/uia-metadata-json-q1' && github.run_attempt == 1
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    steps:
      - name: Checkout only qualification source, no application or historical helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qualification/uia-metadata-json/
      - name: Verify platform, source manifest and script syntax
        shell: pwsh
        working-directory: qualification/uia-metadata-json
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'PLATFORM_STOP' }
          # Current image is measured prospectively, deliberately NOT pinned to E12.
          if (-not $env:ImageOS -or -not $env:ImageVersion) { throw 'IMAGE_IDENTITY_MISSING_STOP' }
          $expected = 'D7C43FF610223144C6F484BAA5666FE48A8E5B64B436CDD7E8E8E8284B540A80'
          if ((Get-FileHash FULL-MANIFEST.json -Algorithm SHA256).Hash -cne $expected) { throw 'MANIFEST_STOP' }
          $manifest = Get-Content FULL-MANIFEST.json -Raw | ConvertFrom-Json
          foreach ($p in $manifest.PSObject.Properties) {
            if ($p.Name -notmatch '^[A-Za-z0-9_.-]+$') { throw 'MANIFEST_PATH_STOP' }
            if ((Get-FileHash -LiteralPath $p.Name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $p.Value) { throw 'SOURCE_HASH_STOP' }
          }
          $tokens = $null; $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path Run-LocalOnly.ps1).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'SCRIPT_PARSE_STOP' }
      - name: One offline prospective metadata and JSON qualification
        timeout-minutes: 2
        shell: pwsh
        working-directory: qualification/uia-metadata-json
        run: ./Run-LocalOnly.ps1
      - name: Bound evidence files before upload
        id: evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'qualification/uia-metadata-json/qualification-output'
          if (-not (Test-Path $root -PathType Container)) { 'No qualification output'; exit 0 }
          $allowed = @('inventory.json','measured-assemblies.json','compile.txt','result.json','completion.json')
          $files = @(Get-ChildItem $root -File | Where-Object { $_.Name -in $allowed })
          if ($files.Count -eq 0) { 'No permitted evidence'; exit 0 }
          if (@($files | Where-Object { $_.Length -gt 2MB }).Count -gt 0) { throw 'EVIDENCE_SIZE_STOP_NO_UPLOAD' }
          'upload=true' >> $env:GITHUB_OUTPUT
      - name: Upload only bounded qualification evidence
        if: always() && steps.evidence.outputs.upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prospective-uia-metadata-json-${{ github.sha }}
          path: |
            qualification/uia-metadata-json/qualification-output/inventory.json
            qualification/uia-metadata-json/qualification-output/measured-assemblies.json
            qualification/uia-metadata-json/qualification-output/compile.txt
            qualification/uia-metadata-json/qualification-output/result.json
            qualification/uia-metadata-json/qualification-output/completion.json
          if-no-files-found: warn
          retention-days: 3
