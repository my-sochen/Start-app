name: ui-contract-sweep
on:
  push:
    branches: [fix/capture-tooltip-wrap]
    paths: ['.github/e2e/**', '.github/workflows/ui-contract-sweep.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Prepare exact candidate contract slices
        shell: pwsh
        run: |
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Disposable hosted runner required'}
          New-Item -ItemType Directory -Force diag,out-images | Out-Null
          python .github/e2e/build-contract-sweep.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          foreach($file in '.github/e2e/cycle1-flow.ps1','.github/e2e/capture-flow.ps1','.github/e2e/contract-cycle.generated.ps1','.github/e2e/contract-capture.generated.ps1'){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors;throw "Parse failed: $file"}
          }
      - name: Tooltip source contracts
        run: dotnet test tests/StartApp.Presentation.Tests -c Release --filter FullyQualifiedName~CaptureTooltipSourceTests
      - name: Build app
        shell: pwsh
        run: |
          dotnet build src/StartApp.App/StartApp.App.csproj -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Readiness discrimination checks
        id: readiness
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/capture-policy/test_capture_readiness.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Cycle contract sections (independent resets)
        id: cycle
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -NoProfile -File .github/e2e/contract-cycle.generated.ps1
          $code=$LASTEXITCODE
          if(Test-Path diag/assertions.json){Move-Item diag/assertions.json diag/contracts-cycle.json}
          exit $code
      - name: Capture contract sections (independent resets)
        id: capture
        if: always() && steps.cycle.outcome != 'skipped'
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -NoProfile -File .github/e2e/contract-capture.generated.ps1
          $code=$LASTEXITCODE
          if(Test-Path diag/capture-assertions.json){Move-Item diag/capture-assertions.json diag/contracts-capture.json}
          exit $code
      - name: Consolidated verdict (never FLOW-COMPLETE)
        if: always()
        shell: pwsh
        run: |
          $bad=$false
          foreach($part in 'cycle','capture'){
            $file="diag/contracts-$part.json"
            if(-not(Test-Path $file)){Write-Host "$part NOT CHECKED";$bad=$true;continue}
            $results=@(Get-Content $file -Raw|ConvertFrom-Json)
            $expected=if($part -eq 'cycle'){@('home-create-four-types','manual-duplicates','saved-menu-and-picker','category-and-unsaved')}else{@('capture-new-palette-dirty-guard','capture-stage-arrow-dropdown-delete','capture-site-default-save-duplicate','capture-program-and-below-viewport-removal')}
            $sections=@($results|Where-Object {$_.name -like 'SECTION *'})
            $names=@($sections|ForEach-Object {$_.name})
            if($sections.Count -ne 4){$bad=$true;Write-Host "$part requires exactly four section results"}
            foreach($name in $expected){if(@($names|Where-Object {$_ -eq "SECTION $name complete"}).Count -ne 1){$bad=$true;Write-Host "Missing, repeated, or failed section: $name"}}
            $results|Where-Object {$_.name -like 'SECTION *'}|Format-Table name,ok,detail -Wrap
            if(@($results|Where-Object {-not $_.ok}).Count){$bad=$true}
          }
          if('${{ steps.readiness.outcome }}' -ne 'success'){$bad=$true}
          if($bad){throw 'One or more independent sections failed or were not checked'}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ui-contract-sweep
          retention-days: 5
          path: |
            diag/
            out-images/
            .github/e2e/contract-*.generated.ps1
