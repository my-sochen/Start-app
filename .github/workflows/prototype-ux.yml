# Bounded feature evidence only. No publication, release, activation or promotion.
name: prototype-ux
on:
  push:
    branches: [feat/prototype-ux-actions]
permissions:
  contents: read
concurrency:
  group: prototype-ux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Bind evidence to exact checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne '${{ github.sha }}') { throw 'Checkout SHA mismatch' }
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Unit and source contracts
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Presentation.Tests --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/StartApp.Platform.Windows.Tests --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real XAML row edit and native context-menu input evidence
        shell: pwsh
        run: |
          dotnet build tests/StartApp.OpeningUiCapture --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $PWD 'tests/StartApp.OpeningUiCapture/bin/Release/net10.0-windows/StartApp.OpeningUiCapture.exe'
          $p = Start-Process $binary -ArgumentList '--prototype-ux','out-prototype-ux' -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw 'UX evidence timed out; no automatic retry' }
          if ($p.ExitCode -ne 0) { throw "UX evidence failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: prototype-ux-evidence
          path: out-prototype-ux/
          if-no-files-found: error
          retention-days: 3
