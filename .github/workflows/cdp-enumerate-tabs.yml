name: cdp-enumerate-tabs
# LOCAL C1 default-directory existing-session candidate. NOT permission to push or run.
# ONE separately reviewed atomicbranch update only, no dispatch/retry.
# Fresh default roots in ephemeral runner account only: exact native-owned Allow Invoke then one read-only
# Target.getTargets. No user profile/product/release modifications.
on:
  push:
    branches:
      - test/cdp-enumerate-tabs-v1
permissions:
  contents: read
concurrency:
  group: cdp-enumerate-tabs
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.deleted == false && github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # Reverify pin/live public repo/free standard runner/branch state before any GO.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact integrated hash gate
        shell: pwsh
        run: |
          $expected = @{
            'startapp-cdp-feasibility/observe-prompt.ps1' = 'c378ed4724ff531191b36b66207a0d7a254fb50cca27807d6aea8779c346feac'
            'startapp-cdp-feasibility/observe-socket.mjs' = '34afdce9f341adc42e6ce47043997d4b8d32da7d1baa7e29c13ed0f0322bc444'
            'startapp-cdp-feasibility/consent-targets.mjs' = 'cbc38ee75344b3195e02b10f01a38efed436b2e5c717c9119ddddbd36cb4d6ab'
            'startapp-cdp-feasibility/classify-observation.mjs' = '7fb2ee5e9634febbc5ef42d3d0a891809c12fafe1bcf6e554249fa0c54e211c9'
            'startapp-cdp-feasibility/extract-observation.py' = '2aef204911265146230c3535c18f4955d64f52706c37befaf9e9285b6b3bcd08'
            'startapp-cdp-feasibility/.gitattributes' = 'a79691a93b46e49ce460c26ef22afcc03d6eca1e63bf2edbc20e96159510f6c9'
          }
          foreach ($path in $expected.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -cne $expected[$path]) { Write-Host "HASH_GATE_FAIL $path $actual"; exit 1 }
            Write-Host "HASH_GATE_OK $path $actual"
          }
      - name: Verify PS7 runtime and print versions
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'Requires PS7/.NET5+ HashData/ToHexString, never Windows PowerShell5.1' }
          [void][Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([byte[]]@(0)))
          Write-Host "RUNTIME_PWSH $($PSVersionTable.PSVersion)"
          Write-Host "RUNTIME_NODE $(node --version)"
          Write-Host "RUNTIME_OS $([Runtime.InteropServices.RuntimeInformation]::OSDescription)"
      - name: Invoke exact owned synthetic consent then read fixture metadata once
        id: probe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'consent-metadata-out'
          & pwsh -NoProfile -File startapp-cdp-feasibility/observe-prompt.ps1 -OutDir $out
          $code = $LASTEXITCODE
          "child_exit=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "out_dir=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0
      - name: Audit bounded consent metadata evidence (never full-gate PASS)
        if: ${{ steps.probe.outcome == 'success' }}
        shell: pwsh
        run: |
          node startapp-cdp-feasibility/classify-observation.mjs "${{ steps.probe.outputs.out_dir }}" "${{ steps.probe.outputs.child_exit }}"
          exit $LASTEXITCODE
