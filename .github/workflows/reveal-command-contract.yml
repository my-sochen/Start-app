name: reveal-command-contract
on:
  push:
    branches: [test/reveal-command-contract]
permissions:
  contents: read
jobs:
  command-registry-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - run: dotnet test tests/StartApp.Presentation.Tests -c Release --filter 'FullyQualifiedName~FeatureCommandOwnershipTests'
