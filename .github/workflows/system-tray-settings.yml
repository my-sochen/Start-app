name: system-tray-settings
on:
  push:
    branches: [feat/system-tray-settings]
permissions:
  contents: read
jobs:
  tray-focused:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Tray storage and close guard contracts only
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Storage.Json.Tests -c Release --filter "FullyQualifiedName~TrayPreferenceTests|FullyQualifiedName~AdvancedColorStorageTests|FullyQualifiedName~Schema4Tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/StartApp.Presentation.Tests -c Release --filter "FullyQualifiedName~TrayPreferenceViewModelTests|FullyQualifiedName~CreateFormGuardTests|FullyQualifiedName~UnsavedExitSessionTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows app, tray menu, bindings, close and exit
        shell: pwsh
        run: |
          dotnet build tests/StartApp.TrayCapture -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary=Join-Path $PWD 'tests/StartApp.TrayCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe'
          $output=Join-Path $PWD 'tray-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'"') -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill($true); throw 'Tray capture timeout' }
          if ($p.ExitCode -ne 0) { Get-Content "$output/error.txt"; throw 'Tray capture failed' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tray-evidence
          path: tray-evidence/
          retention-days: 7
