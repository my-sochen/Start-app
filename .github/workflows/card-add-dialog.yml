name: card-add-dialog
on:
  push:
    branches: [feat/card-add-dialog]
permissions:
  contents: read
jobs:
  card-add:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - shell: pwsh
        run: |
          dotnet test tests/StartApp.Presentation.Tests -c Release --filter "FullyQualifiedName~CardAddTests|FullyQualifiedName~CreateFormGuardTests|FullyQualifiedName~ResourcePickerTests"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          dotnet build tests/StartApp.CardAddCapture -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $p=Start-Process tests/StartApp.CardAddCapture/bin/Release/net10.0-windows/StartApp.CardAddCapture.exe -ArgumentList "$PWD/card-add-evidence" -PassThru
          if(-not $p.WaitForExit(90000)){$p.Kill($true);throw 'UI timeout'}
          if($p.ExitCode -ne 0){Get-Content card-add-evidence/error.txt;throw 'UI check failed'}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: card-add-evidence
          path: card-add-evidence/
