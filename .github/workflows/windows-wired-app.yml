# CI-only evidence run for the item-description feature (PR stacked on #16). Real normal StartApp.App.exe, UI Automation, synthetic data only.: the NORMAL StartApp.App.exe (real composition: real preflight, real WindowsLauncher, real ProcessStarter) driven by UI Automation.
# Synthetic temp files only. The only program that may really start is the marker-only ci-helper (writes a marker file and exits). A missing file goes to the real shell and must fail.
# No browser, no network, no user files. The app store is the runner profile's %LOCALAPPDATA%\StartApp (throwaway VM; the app ignores the LOCALAPPDATA env var).
name: windows-wired-app
on:
  push:
    branches: [ci/smoke-wired-app]
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build normal App and helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diag, out-images | Out-Null
          dotnet build src/StartApp.App/StartApp.App.csproj --configuration Release 2>&1 | Tee-Object diag/build-app.txt | Select-Object -Last 3
          dotnet build ci-helper/Helper.csproj --configuration Release 2>&1 | Tee-Object diag/build-helper.txt | Select-Object -Last 3
      - name: All unit tests (Windows, whole solution)
        shell: pwsh
        run: |
          dotnet test StartApp.slnx --configuration Release 2>&1 | Tee-Object diag/test-all.txt | Select-String 'Passed!|Failed!|error' | ForEach-Object { $_.Line }
          if ($LASTEXITCODE -ne 0) { 'SOLUTION TESTS FAILED' | Out-File -Append diag/errors.txt }
      - name: Wired normal app UI run
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class W { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r); }'
          $A = [System.Windows.Automation.AutomationElement]; $CT = [System.Windows.Automation.ControlType]; $PC = [System.Windows.Automation.PropertyCondition]; $TS = [System.Windows.Automation.TreeScope]
          $results = New-Object System.Collections.ArrayList; $script:shot = 0; $runId = $env:GITHUB_RUN_ID
          function Assert($name, $ok, $detail) { [void]$results.Add([ordered]@{ name = $name; ok = [bool]$ok; detail = "$detail" }); "ASSERT $(if ($ok) {'PASS'} else {'FAIL'}) $name :: $detail" }
          function Info($name, $detail) { [void]$results.Add([ordered]@{ name = $name; info = $true; detail = "$detail" }); "INFO $name :: $detail" }
          function Shot($state) {
            $script:shot++; $f = "out-images/run$runId-desc-{0:00}-$state.png" -f $script:shot
            $r = New-Object W+R; [void][W]::GetWindowRect($p.MainWindowHandle, [ref]$r); $w = $r.Rt - $r.L; $h = $r.B - $r.T
            if ($w -le 0 -or $h -le 0) { "no window rect for $state" | Tee-Object -Append diag/errors.txt; return }
            $bmp = New-Object System.Drawing.Bitmap $w, $h; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size); $bmp.Save("$PWD/$f"); "shot $f ${w}x${h}"
          }
          function Texts() { @($win.FindAll($TS::Descendants, (New-Object $PC($A::ControlTypeProperty, $CT::Text))) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) }
          function ListLines() { @($win.FindAll($TS::Descendants, (New-Object $PC($A::ControlTypeProperty, $CT::ListItem))) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) }
          function Btn($name) { $win.FindFirst($TS::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object $PC($A::ControlTypeProperty, $CT::Button)), (New-Object $PC($A::NameProperty, $name))))) }
          function ClickBtn($name, $settle = 800) {
            $b = $null; for ($i = 0; $i -lt 40; $i++) { $b = Btn $name; if ($b -and $b.Current.IsEnabled) { break }; Start-Sleep -Milliseconds 250 }
            if (-not $b) { return "button '$name' not found" }; if (-not $b.Current.IsEnabled) { return "button '$name' stayed disabled" }
            $b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep -Milliseconds $settle; return 'ok'
          }
          function WaitText($needle, $secs) { $sw = [Diagnostics.Stopwatch]::StartNew(); while ($sw.Elapsed.TotalSeconds -lt $secs) { if (@(Texts) + @(ListLines) | Where-Object { $_ -like "*$needle*" }) { return $true }; Start-Sleep -Milliseconds 250 }; return $false }
          function Edits() { $win.FindAll($TS::Descendants, (New-Object $PC($A::ControlTypeProperty, $CT::Edit))) | Sort-Object { $_.Current.BoundingRectangle.X } }
          function SetText($edit, $text) { $edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($text); Start-Sleep -Milliseconds 400 }
          function SetType($typeName) {
            $combo = $win.FindFirst($TS::Descendants, (New-Object $PC($A::ControlTypeProperty, $CT::ComboBox)))
            if (-not $combo) { return 'combo not found' }
            $combo.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand(); Start-Sleep -Milliseconds 400
            $it = $combo.FindFirst($TS::Descendants, (New-Object $PC($A::NameProperty, $typeName)))
            if (-not $it) { $it = $A::RootElement.FindFirst($TS::Descendants, (New-Object $PC($A::NameProperty, $typeName))) }
            if (-not $it) { return "type item '$typeName' not found" }
            $it.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select(); Start-Sleep -Milliseconds 400; return 'ok'
          }
          function TopWindows() { @($A::RootElement.FindAll($TS::Children, (New-Object $PC($A::ControlTypeProperty, $CT::Window))) | ForEach-Object { "$($_.Current.Name)[pid=$($_.Current.ProcessId)]" }) -join ' | ' }
          try {
            $root = Join-Path $env:RUNNER_TEMP 'desc-tree'; New-Item -ItemType Directory -Force $root | Out-Null
            Set-Content "$root\ok.txt" 'synthetic'; Set-Content "$root\notes.txt" 'synthetic'; Set-Content "$root\plain.txt" 'synthetic'
            $storeDir = Join-Path $env:LOCALAPPDATA 'StartApp'; New-Item -ItemType Directory -Force $storeDir | Out-Null; $store = Join-Path $storeDir 'store.json'
            # OLD-format store: no "description" anywhere (as written by the previous versions)
            $okEsc = ($root -replace '\\','\\') + '\\ok.txt'
            $old = '{"schemaVersion":1,"items":{"it_old1":{"id":"it_old1","type":"file","name":"legacy.txt","target":"' + $okEsc + '"}},"workspaces":[{"id":"ws_old1","name":"Old file ws","items":[{"itemId":"it_old1"}]}]}'
            Set-Content -Path $store -Value $old -NoNewline -Encoding UTF8
            Assert 'old-format store has no description key' (-not ((Get-Content $store -Raw) -match 'description')) ''
            $exe = Get-ChildItem -Recurse src/StartApp.App/bin/Release -Filter StartApp.App.exe | Select-Object -First 1
            function StartApp1() {
              $script:p = Start-Process -FilePath $exe.FullName -PassThru
              $sw = [Diagnostics.Stopwatch]::StartNew()
              while ($sw.Elapsed.TotalSeconds -lt 60) { $script:p.Refresh(); if ($script:p.HasExited -or $script:p.MainWindowHandle -ne 0) { break }; Start-Sleep -Milliseconds 500 }
              Start-Sleep -Seconds 2
              $script:win = $A::RootElement.FindFirst($TS::Children, (New-Object $PC($A::ProcessIdProperty, $script:p.Id)))
            }
            function PickWs($name) {
              foreach ($li in @($win.FindAll($TS::Descendants, (New-Object $PC($A::ControlTypeProperty, $CT::ListItem))))) { $tx = $li.FindFirst($TS::Descendants, (New-Object $PC($A::NameProperty, $name))); if ($tx) { $li.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select(); Start-Sleep -Milliseconds 700; return 'selected' } }
              return 'not found'
            }
            function DescBox() { $win.FindFirst($TS::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object $PC($A::ControlTypeProperty, $CT::Edit)), (New-Object $PC($A::NameProperty, 'Item description'))))) }
            function TargetBox() { @(Edits | Where-Object { $_.Current.Name -ne 'Item description' })[1] }
            StartApp1
            Assert 'app window opened with the OLD store' (-not $p.HasExited -and $p.MainWindowHandle -ne 0) ''
            Assert 'old workspace selected' ((PickWs 'Old file ws') -eq 'selected') ''
            Assert 'old item listed' (WaitText 'legacy.txt' 20) ((ListLines) -join ' || ')
            Assert 'description field exists' ($null -ne (DescBox)) ''
            Shot 'old-file-loaded'; Info 'rows after loading the old file (UIA)' ((ListLines) -join ' || ')
            # add: file with Hebrew+English description; file without description; same target as the old item with a description (fills the empty one)
            $adds = @(@{ v = "$root\notes.txt"; d = 'Meeting notes - תיאור בעברית' }, @{ v = "$root\plain.txt"; d = '' }, @{ v = "$root\ok.txt"; d = 'Filled for the old item' })
            foreach ($ad in $adds) {
              [void](SetType 'File'); SetText (TargetBox) $ad.v; SetText (DescBox) $ad.d; $c = ClickBtn 'Add' 500; Assert "add $($ad.v | Split-Path -Leaf) desc='$($ad.d)'" ($c -eq 'ok') $c
            }
            Assert 'description box cleared after the last add' ((DescBox).GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).Current.Value -eq '') ''
            Start-Sleep -Milliseconds 600; Shot 'descriptions-added'; Info 'rows after adding (UIA)' ((ListLines) -join ' || ')
            $rows = (ListLines) -join ' || '
            Assert 'row with Hebrew+English description present' ($rows -match 'Meeting notes - תיאור בעברית') $rows
            Assert 'old item received the description (fill-only-when-empty)' (@($rows -split ' \|\| ' | Where-Object { $_ -match 'legacy\.txt' -and $_ -match 'Filled for the old item' }).Count -eq 1) $rows
            Assert 'plain item has no description' (@($rows -split ' \|\| ' | Where-Object { $_ -match 'plain\.txt' -and $_ -match 'Description =\s*\}' }).Count -eq 1) $rows
            # a too-long description must be refused: the box is limited to 500 characters (UI MaxLength); typing 600 stores at most 500 in the UI
            $null = $p.CloseMainWindow(); Start-Sleep 3; if (-not $p.HasExited) { $p.Kill() }
            $json = Get-Content $store -Raw -Encoding UTF8; Info 'store.json after run 1 (synthetic)' ($json -replace '\s+', ' ')
            Assert 'store.json now has the descriptions' ($json -match 'Meeting notes' -and $json -match 'Filled for the old item') ''
            Assert 'old item and its id kept' ($json -match 'it_old1' -and $json -match 'legacy.txt') ''
            # restart: persistence
            StartApp1
            Assert 'restart opened' (-not $p.HasExited -and $p.MainWindowHandle -ne 0) ''
            Assert 'workspace selected after restart' ((PickWs 'Old file ws') -eq 'selected') ''
            Assert 'descriptions survive restart' (WaitText 'Filled for the old item' 20) ((ListLines) -join ' || ')
            Start-Sleep -Milliseconds 600; Shot 'after-restart'; Info 'rows after restart (UIA)' ((ListLines) -join ' || ')
            Info 'top-level windows at end' (TopWindows)
          }
          catch { "script error: $_" | Tee-Object -Append diag/errors.txt; [void]$results.Add([ordered]@{ name = 'script error'; ok = $false; detail = "$_" }) }
          finally {
            $results | ConvertTo-Json -Depth 4 | Out-File diag/assertions.json
            if ($p -and -not $p.HasExited) { $null = $p.CloseMainWindow(); Start-Sleep 3; if (-not $p.HasExited) { $p.Kill() } }
          }
          if (@($results | Where-Object { $_.ok -eq $false }).Count -gt 0) { 'UI ASSERTIONS FAILED' | Out-File -Append diag/errors.txt }
        continue-on-error: true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-desc-01-old-file-loaded.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-desc-02-descriptions-added.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          path: out-images/run${{ github.run_id }}-desc-03-after-restart.png
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diagnostics-wired-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: diag/
          if-no-files-found: warn
      - name: Fail the job if anything failed
        if: always()
        shell: pwsh
        run: |
          if (Test-Path diag/errors.txt) { Get-Content diag/errors.txt; exit 1 }
