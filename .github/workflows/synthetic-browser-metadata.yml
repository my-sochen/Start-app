name: Synthetic browser metadata isolated candidate
'on':
  push:
    branches: ['diag/synthetic-browser-metadata-v1']
    paths:
      - '.github/workflows/synthetic-browser-metadata.yml'
      - 'diagnostic-browser/**'
permissions:
  contents: read
concurrency:
  group: synthetic-browser-metadata-v1
  cancel-in-progress: false
jobs:
  chrome:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/synthetic-browser-metadata-v1'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify allocated image and preinstalled SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ImageVersion -cne '20261111.331.1') { throw 'UNSUPPORTED allocated image, no install or pin change' }
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'UNSUPPORTED dotnet absent' }
          $sdks = dotnet --list-sdks
          if (-not ($sdks -match '^10\.')) { throw 'UNSUPPORTED preinstalled SDK' }
      - name: Compile exact reviewed candidate
        shell: pwsh
        working-directory: diagnostic-browser
        run: |
          dotnet build SyntheticLaunch.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed, no runtime' }
      - name: One synthetic-only full-debugging consent and metadata attempt
        shell: pwsh
        working-directory: diagnostic-browser
        run: ./run-proposed.ps1 -Browser 'chrome'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: synthetic-browser-chrome
          path: diagnostic-browser/synthetic-chrome/
          if-no-files-found: warn
          retention-days: 3
  edge:
    needs: chrome
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/synthetic-browser-metadata-v1'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify allocated image and preinstalled SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ImageVersion -cne '20261111.331.1') { throw 'UNSUPPORTED allocated image, no install or pin change' }
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'UNSUPPORTED dotnet absent' }
          $sdks = dotnet --list-sdks
          if (-not ($sdks -match '^10\.')) { throw 'UNSUPPORTED preinstalled SDK' }
      - name: Compile exact reviewed candidate
        shell: pwsh
        working-directory: diagnostic-browser
        run: |
          dotnet build SyntheticLaunch.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed, no runtime' }
      - name: One synthetic-only full-debugging consent and metadata attempt
        shell: pwsh
        working-directory: diagnostic-browser
        run: ./run-proposed.ps1 -Browser 'edge'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: synthetic-browser-edge
          path: diagnostic-browser/synthetic-edge/
          if-no-files-found: warn
          retention-days: 3
