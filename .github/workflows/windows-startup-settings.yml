name: windows-startup-settings
on:
  push:
    branches: [feat/windows-startup-settings]
permissions:
  contents: read
jobs:
  startup-focused:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Sign-in and default-workspace contracts only
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Presentation.Tests -c Release --filter "FullyQualifiedName~SignInStartupTests|FullyQualifiedName~DefaultWorkspaceSessionTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows settings, registry and offline launch report
        shell: pwsh
        run: |
          dotnet build tests/StartApp.StartupCapture -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary=Join-Path $PWD 'tests/StartApp.StartupCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe'
          $output=Join-Path $PWD 'startup-evidence'
          $p=Start-Process $binary -ArgumentList ('"'+$output+'"') -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill($true); throw 'Startup capture timeout' }
          if ($p.ExitCode -ne 0) { Get-Content "$output/error.txt"; throw 'Startup capture failed' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: startup-evidence
          path: startup-evidence/
          retention-days: 7
