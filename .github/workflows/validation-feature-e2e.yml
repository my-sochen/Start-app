# VALIDATION-ONLY run of the release-prepare mechanics. NOT the release pipeline.
# Purpose: verify the pipeline MECHANICS (resolve, tests, ui-gate, package, verify, artifact) stay green
# on a hosted runner with the NEW e2e coverage (multi-window scan, design-preview store assertions,
# saved-item delete) and the scoped banner wording, on a fresh isolated branch from
# feat/per-instance-items@9e681f1b00724dd668e17308050bdbb6979323fd, BEFORE anything is merged.
# Hard boundaries of this file:
#   * trigger: push to branch test/feature-e2e-validation touching ONLY this workflow file's path,
#     so dependency commits never start a run; exactly one run per workflow-file change.
#   * FORCED dry-run: there is no draft-release job, no release, no tag, no pointer update, no publish.
#     No step in this workflow can create or modify any release, tag, or repository variable.
#   * permissions: contents: read, nothing else. No secrets, no repo variables, no Environments.
#   * KNOWN SCOPE LIMIT: candidate sha == workflow sha here (both are the branch head), so the
#     trusted/candidate SOURCE separation of release-prepare.yml is NOT exercised; only the checkout
#     ORDER mechanics are. The e2e scripts come from the same commit they gate (self-gate, see PLAN.md).
#   * A green run means: the mechanics worked once on this revision. It is NOT a release-readiness claim.
name: validation-feature-e2e
on:
  push:
    branches: [test/feature-e2e-validation]
    paths: ['.github/workflows/validation-feature-e2e.yml']
concurrency:
  group: validation-feature-e2e
  cancel-in-progress: false
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  SHA: ${{ github.sha }}
  VERSION: '0.1.0-proto.1'
  REPO: ${{ github.repository }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -u
          [ "$IS_PRIVATE" = "false" ] || { echo "repository is not public (or visibility unknown): failing loudly instead of skipping"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 lowercase hex"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-proto\.[0-9]+$ ]] || { echo "version must look like 0.1.0-proto.1 (prototype channel)"; exit 1; }
          git cat-file -e "$SHA^{commit}" || { echo "sha not found in repo"; exit 1; }
          if git merge-base --is-ancestor "$SHA" origin/main; then echo "on_main=true (informational only in validation)"; else echo "on_main=false (expected: validation branch is not on main)"; fi
          for f in .github/release/verify_candidate.py .github/release/make_manifest.py .github/release/ui_gate_check.py .github/release/KNOWN-LIMITS.txt .github/e2e/smoke-package.ps1; do [ -f "$f" ] || { echo "workflow revision lacks $f"; exit 1; }; done
          for f in .github/e2e/cycle1-flow.ps1 .github/e2e/capture-flow.ps1; do git cat-file -e "$SHA:$f" || { echo "candidate sha lacks $f (UI gate cannot run)"; exit 1; }; done
          bash .github/release/check_tag_free.sh "$REPO" "v$VERSION" || echo "(validation: tag state noted, not blocking)"

  tests:            # HARD GATE: whole-solution unit tests on the exact pushed sha
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Unit tests (fail the job on any failure)
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:SHA) { 'checked out sha differs'; exit 1 }
          dotnet test StartApp.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

  ui-gate:          # HARD GATE: UI flows on this exact sha, evaluated by the checker (trusted path exercised mechanically)
    needs: [resolve, tests]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1       # candidate FIRST, at repo root (e2e scripts use src/... and diag/ relative paths).
      - uses: actions/checkout@v7.0.1       # trusted SECOND, same sha in validation (no source separation claimed).
        with: { path: trusted }
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Checks before any UI run
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:SHA) { 'checked out sha differs'; exit 1 }
          if (-not (Test-Path trusted/.github/release/ui_gate_check.py)) { 'trusted checker missing after checkouts'; exit 1 }
          python --version; if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force diag, out-images | Out-Null
          $bad = $false
          foreach ($f in '.github/e2e/cycle1-flow.ps1', '.github/e2e/capture-flow.ps1') {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) { $bad = $true; "PARSE ERRORS in ${f}" | Tee-Object -Append diag/errors.txt }
          }
          if ($bad) { exit 1 }
      - name: Build App (fail on error)
        shell: pwsh
        run: |
          dotnet build src/StartApp.App/StartApp.App.csproj --configuration Release 2>&1 | Tee-Object diag/build-app.txt | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { 'BUILD FAILED' | Out-File -Append diag/errors.txt; exit 1 }
      - name: Cycle-1 flow UI run (hard - a failing step fails this job)
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:SHA   # scripts write $env:GITHUB_SHA into their completion marker; make the source explicit
          pwsh -NoProfile -File .github/e2e/cycle1-flow.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Capture flow UI run (hard)
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:SHA
          pwsh -NoProfile -File .github/e2e/capture-flow.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Evaluate assertions with the checker (same rules as windows-open-flow-feat)
        if: always()
        shell: pwsh
        run: |
          python trusted/.github/release/ui_gate_check.py --diag diag --sha $env:SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validation-ui-gate-diagnostics
          retention-days: 5
          if-no-files-found: warn
          path: |
            diag/
            out-images/

  package:          # same steps as the proposed package job; runs after tests passed on this sha
    needs: [resolve, tests, ui-gate]
    if: ${{ always() && needs.tests.result == 'success' }}   # still packages when ui-gate failed, so the artifact can be inspected; manifest then says ui_gate=failed
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UI_GATE: ${{ needs.ui-gate.result == 'success' && 'passed' || 'failed' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { path: trusted }
      - uses: actions/checkout@v7.0.1
        with: { path: src }
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Dependency check (fail fast)
        shell: pwsh
        run: |
          python --version; if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in 'trusted/.github/release/verify_candidate.py','trusted/.github/release/make_manifest.py','trusted/.github/release/KNOWN-LIMITS.txt','trusted/.github/e2e/smoke-package.ps1') { if (-not (Test-Path $f)) { "missing trusted file $f"; exit 1 } }
          if ((git -C src rev-parse HEAD) -ne $env:SHA) { 'candidate checkout differs from pushed sha'; exit 1 }
      - name: Publish twice, same path, cleaned between
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force pkg-a, pkg-b, diag | Out-Null
          foreach ($out in 'pkg-a','pkg-b') {
            if (Test-Path artifacts) { Remove-Item -Recurse -Force artifacts }
            dotnet publish src/StartApp.App/StartApp.App.csproj -c Release -r win-x64 --self-contained true -p:ContinuousIntegrationBuild=true --artifacts-path artifacts -nr:false -o $out 2>&1 | Tee-Object "diag/publish-$out.txt" | Select-Object -Last 2
            if ($LASTEXITCODE -ne 0) { "publish failed for $out" | Out-File -Append diag/errors.txt }
          }
          if (Test-Path diag/errors.txt) { exit 1 }
      - name: Stamp identical prototype notice and known limits into both payloads
        shell: pwsh
        working-directory: src
        run: |
          $notice = @(
            'PROTOTYPE / אב-טיפוס'
            'This package is a PROTOTYPE build for evaluation only - not a stable or final distribution.'
            'חבילה זו היא אב-טיפוס לצורכי הערכה בלבד - זו אינה הפצה יציבה או סופית.'
            "commit: $env:SHA (version: $env:VERSION)"
          )
          foreach ($out in 'pkg-a','pkg-b') { $notice | Out-File -Encoding utf8 "$out\PROTOTYPE-NOTICE.txt"; Copy-Item ..\trusted\.github\release\KNOWN-LIMITS.txt "$out\KNOWN-LIMITS.txt" }
      - name: Compare payloads (REPORT ONLY, never fails the job)
        shell: pwsh
        working-directory: src
        run: |
          function PayloadHashes($dir) { $root=(Resolve-Path $dir).Path; Get-ChildItem -Recurse -File $dir | Sort-Object FullName | ForEach-Object { $_.FullName.Substring($root.Length) + ':' + (Get-FileHash $_.FullName -Algorithm SHA256).Hash } }
          $diff = Compare-Object (PayloadHashes 'pkg-a') (PayloadHashes 'pkg-b')
          if ($diff) { 'REPRODUCIBLE=no (same-runner, same-path comparison; report only)' | Tee-Object diag/reproducibility.txt; $diff | Format-Table | Out-String | Tee-Object diag/reproducibility-diff.txt }
          else { 'REPRODUCIBLE=yes (scoped: same runner image, same paths; not a cross-run guarantee)' | Tee-Object diag/reproducibility.txt }
      - name: Build normalized ZIP, hash, BUILDINFO, manifest
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Force cand | Out-Null
          $zipPath = "$PWD\cand\StartApp-win-x64.zip"
          $fs = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::CreateNew)
          $zip = New-Object System.IO.Compression.ZipArchive($fs, [System.IO.Compression.ZipArchiveMode]::Create)
          $epoch = [DateTimeOffset]::new(2026,1,1,0,0,0,[TimeSpan]::Zero)
          $rootA = (Resolve-Path src/pkg-a).Path
          $files = @(Get-ChildItem -Recurse -File src/pkg-a | ForEach-Object { [pscustomobject]@{ Rel = $_.FullName.Substring($rootA.Length + 1).Replace('\','/'); Path = $_.FullName } })
          $rels = [string[]]@($files | ForEach-Object { $_.Rel }); $keys = [string[]]@($rels.Clone()); [Array]::Sort($keys, [StringComparer]::Ordinal)   # ordinal, culture-independent entry order
          $byRel = @{}; foreach ($f in $files) { $byRel[$f.Rel] = $f.Path }
          foreach ($rel in $keys) {
            $entry = $zip.CreateEntry($rel); $entry.LastWriteTime = $epoch
            $es = $entry.Open(); $s = [System.IO.File]::OpenRead($byRel[$rel]); $s.CopyTo($es); $s.Dispose(); $es.Dispose()
          }
          $zip.Dispose(); $fs.Dispose()
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash StartApp-win-x64.zip" | Out-File -Encoding ascii cand/StartApp-win-x64.zip.sha256
          @(
            "commit: $env:SHA"
            "version: $env:VERSION"
            "run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            "distribution: PROTOTYPE (evaluation only)"
            "sdk: $(dotnet --version)"
            "built-utc: $([DateTime]::UtcNow.ToString('o'))"
            "repro: $((Get-Content src/diag/reproducibility.txt -Raw).Trim())"
            "sha256: $hash"
          ) | Out-File -Encoding utf8 cand/BUILDINFO.txt
          Copy-Item src/diag/reproducibility.txt cand/reproducibility.txt
          python trusted/.github/release/make_manifest.py --dir cand --sha $env:SHA --version $env:VERSION --ui-gate $env:UI_GATE
      - name: Smoke-run the ZIP that would ship (FAILURE GATE, smoke script)
        shell: pwsh
        run: |
          Expand-Archive -Path cand/StartApp-win-x64.zip -DestinationPath verify-ship -Force
          pwsh -NoProfile -File trusted/.github/e2e/smoke-package.ps1 -ExePath 'verify-ship\StartApp.App.exe'
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Verify candidate consistency (verifier)
        shell: pwsh
        run: |
          python trusted/.github/release/verify_candidate.py --dir cand --sha $env:SHA --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: StartApp-validation-candidate
          retention-days: 5
          if-no-files-found: error
          path: cand/*

# Rerun the gate after the comma-list parse fix in the bottom-edge pixel capture.
