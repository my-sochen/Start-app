# Validation-only artifact pipeline for feature -> dev -> test. Never runs on main.
# Every push to the named branches is checked, not only workflow edits.
# PERMANENT ROUTE: the test-stage branch is test/validation. A literal 'test' branch
# cannot be created while test/* refs exist (Git ref namespace: no ref as both parent
# and child), so the durable stage branch lives under the existing namespace.
# This file does not create a branch or deployment.
# Add this workflow only after all reviewed dependencies are committed and verified.
# No release/tag/pointer/publish jobs, repository variables or Environments.
# contents:read only. Failed UI may still produce an inspection artifact labeled
# ui_gate=failed; artifact presence is not a pass or distribution authorization.
# Candidate and checker use the same pushed revision (self-gate); source separation
# is not established. A green run is scoped evidence for this revision only, not
# complete coverage, reproducibility across machines or release readiness.
name: validation-feature-e2e
on:
  push:
    branches: [fix/folder-root-paths, fix/native-picker-readiness, feat/update-settings-placement, feat/approved-update-notifier, feat/portable-release-wiring-local, feat/portable-candidate-integration, feat/per-instance-items, feat/browser-icon-display, feat/release-integration-unified, dev, test/validation]
concurrency:
  group: validation-feature-e2e-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  SHA: ${{ github.sha }}
  VERSION: '0.1.0-proto.1'
  REPO: ${{ github.repository }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -u
          [ "$IS_PRIVATE" = "false" ] || { echo "repository is not public (or visibility unknown): failing loudly instead of skipping"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 lowercase hex"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-proto\.[0-9]+$ ]] || { echo "version must look like 0.1.0-proto.1 (prototype channel)"; exit 1; }
          git cat-file -e "$SHA^{commit}" || { echo "sha not found in repo"; exit 1; }
          if git merge-base --is-ancestor "$SHA" origin/main; then echo "on_main=true (informational only in validation)"; else echo "on_main=false (expected: validation branch is not on main)"; fi
          for f in .github/release/verify_candidate.py .github/release/make_manifest.py .github/release/ui_gate_check.py .github/release/KNOWN-LIMITS.txt .github/e2e/smoke-package.ps1; do [ -f "$f" ] || { echo "workflow revision lacks $f"; exit 1; }; done
          for f in .github/e2e/cycle1-flow.ps1 .github/e2e/capture-flow.ps1; do git cat-file -e "$SHA:$f" || { echo "candidate sha lacks $f (UI gate cannot run)"; exit 1; }; done
          bash .github/release/check_tag_free.sh "$REPO" "v$VERSION" || echo "(validation: tag state noted, not blocking)"

      - name: Static release wiring policy checks (no release execution)
        shell: bash
        run: |
          python tests/release/test_release_portable_wiring.py

  tests:            # HARD GATE: whole-solution unit tests on the exact pushed sha
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Unit tests (fail the job on any failure)
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:SHA) { 'checked out sha differs'; exit 1 }
          dotnet test StartApp.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

  ui-gate:          # HARD GATE: UI flows on this exact sha, evaluated by the checker (trusted path exercised mechanically)
    needs: [resolve, tests]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1       # candidate FIRST, at repo root (e2e scripts use src/... and diag/ relative paths).
      - uses: actions/checkout@v7.0.1       # trusted SECOND, same sha in validation (no source separation claimed).
        with: { path: trusted }
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Checks before any UI run
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:SHA) { 'checked out sha differs'; exit 1 }
          if (-not (Test-Path trusted/.github/release/ui_gate_check.py)) { 'trusted checker missing after checkouts'; exit 1 }
          python --version; if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force diag, out-images | Out-Null
          $bad = $false
          foreach ($f in '.github/e2e/cycle1-flow.ps1', '.github/e2e/capture-flow.ps1') {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) { $bad = $true; "PARSE ERRORS in ${f}" | Tee-Object -Append diag/errors.txt }
          }
          if ($bad) { exit 1 }
      - name: Build App (fail on error)
        shell: pwsh
        run: |
          dotnet build src/StartApp.App/StartApp.App.csproj --configuration Release 2>&1 | Tee-Object diag/build-app.txt | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { 'BUILD FAILED' | Out-File -Append diag/errors.txt; exit 1 }
      - name: Synthetic update state captures (no network or real browser)
        shell: pwsh
        run: |
          python tests/update-notifier/test_overlay_rows.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build tests/StartApp.UpdateUiCapture/StartApp.UpdateUiCapture.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $output = Join-Path $env:RUNNER_TEMP ("update-capture-" + [guid]::NewGuid().ToString('N'))
          if (Test-Path $output) { throw 'capture output already exists; refusing reuse' }
          $destination = Join-Path $PWD 'out-images/update-states'
          if (Test-Path $destination) { throw 'capture destination already exists; refusing nested copy/reuse' }
          $binary = Join-Path $PWD 'tests/StartApp.UpdateUiCapture/bin/Release/net10.0-windows/StartApp.UpdateUiCapture.exe'
          # Bounded child lifetime; only this capture process tree is terminated. No
          # machine-wide cleanup or real LOCALAPPDATA access by this test program.
          $capture = Start-Process -FilePath $binary -ArgumentList ('"' + $output + '"') -PassThru
          try {
            if (-not $capture.WaitForExit(60000)) {
              $capture.Kill($true)
              throw 'synthetic WPF capture timed out'
            }
            if ($capture.ExitCode -ne 0) { throw "capture exited $($capture.ExitCode)" }
          } finally {
            if (Test-Path $output) { Copy-Item -Path $output -Destination $destination -Recurse }
            $capture.Dispose()
          }
          $pngs = @(Get-ChildItem out-images/update-states -Filter '*.png')
          if ($pngs.Count -ne 18) { throw "Expected eighteen WPF state images (eight main, eight settings, two startup popups), found $($pngs.Count)" }
          if (-not (Test-Path out-images/update-states/capture-evidence.json)) { throw 'capture metadata missing' }
      - name: Cycle-1 flow UI run (hard - a failing step fails this job)
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:SHA   # scripts write $env:GITHUB_SHA into their completion marker; make the source explicit
          pwsh -NoProfile -File .github/e2e/cycle1-flow.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Capture flow UI run (hard)
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:SHA
          pwsh -NoProfile -File .github/e2e/capture-flow.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real drive-root acceptance (feature branch only, disposable hosted desktop)
        if: github.ref == 'refs/heads/fix/folder-root-paths'
        shell: pwsh
        env:
          STARTAPP_ROOT_ACCEPTANCE: hosted-disposable-desktop-only
        run: |
          $env:GITHUB_SHA = $env:SHA
          dotnet build tests/StartApp.RootAcceptance/StartApp.RootAcceptance.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $output = Join-Path $PWD 'out-images/root-acceptance'
          $scratch = Join-Path $env:RUNNER_TEMP ('startapp-root-' + [guid]::NewGuid().ToString('N'))
          if ((Test-Path $output) -or (Test-Path $scratch)) { throw 'root acceptance paths must be new' }
          $binary = Join-Path $PWD 'tests/StartApp.RootAcceptance/bin/Release/net10.0-windows/StartApp.RootAcceptance.exe'
          $child = Start-Process -FilePath $binary -ArgumentList ('"' + $output + '" "' + $scratch + '"') -PassThru -RedirectStandardOutput 'diag/root-acceptance-stdout.txt' -RedirectStandardError 'diag/root-acceptance-stderr.txt'
          try {
            if (-not $child.WaitForExit(180000)) {
              $child.Kill($true)
              'Root acceptance timed out; child killed only. Explorer cleanup is unverified; disposable runner will be discarded.' | Out-File -Append diag/errors.txt
              throw 'root acceptance timed out'
            }
            if ($child.ExitCode -ne 0) { throw "root acceptance failed ($($child.ExitCode))" }
            $rows = @(Get-Content (Join-Path $output 'root-assertions.json') -Raw | ConvertFrom-Json)
            if (-not $rows.Count -or @($rows | Where-Object { -not $_.Ok }).Count -or -not @($rows | Where-Object { $_.Name -eq 'FLOW-COMPLETE' -and $_.Detail -eq $env:SHA }).Count) { throw 'root assertion completion gate failed' }
            foreach ($image in 'first-root.png','reopened-root.png') {
              if (-not (Test-Path (Join-Path $output $image))) { throw "missing $image" }
            }
            $remaining = @(Get-Content (Join-Path $output 'owned-windows-remaining.json') -Raw | ConvertFrom-Json)
            if ($remaining.Count) { throw 'owned Explorer windows remain' }
            if (Test-Path $scratch) { throw 'scratch directory remains' }
          } finally { $child.Dispose() }
      - name: Evaluate assertions with the checker (same rules as windows-open-flow-feat)
        if: always()
        shell: pwsh
        run: |
          python trusted/.github/release/ui_gate_check.py --diag diag --sha $env:SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validation-ui-gate-diagnostics
          retention-days: 5
          if-no-files-found: warn
          path: |
            diag/
            out-images/

  package:          # same steps as the proposed package job; runs after tests passed on this sha
    needs: [resolve, tests, ui-gate]
    if: ${{ always() && needs.tests.result == 'success' }}   # still packages when ui-gate failed, so the artifact can be inspected; manifest then says ui_gate=failed
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UI_GATE: ${{ needs.ui-gate.result == 'success' && 'passed' || 'failed' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { path: trusted }
      - uses: actions/checkout@v7.0.1
        with: { path: src }
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Dependency check (fail fast)
        shell: pwsh
        run: |
          python --version; if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in 'trusted/.github/release/verify_candidate.py','trusted/.github/release/make_manifest.py','trusted/.github/release/KNOWN-LIMITS.txt','trusted/.github/e2e/smoke-package.ps1') { if (-not (Test-Path $f)) { "missing trusted file $f"; exit 1 } }
          if ((git -C src rev-parse HEAD) -ne $env:SHA) { 'candidate checkout differs from pushed sha'; exit 1 }
          foreach($f in 'trusted/tools/portable-entry/package.ps1','trusted/tools/portable-entry/smoke-candidate.ps1') {
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors | Format-List;exit 1}
          }
          python trusted/tests/release/test_portable_candidate.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish twice, same path, cleaned between
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force pkg-a, pkg-b, diag | Out-Null
          foreach ($out in 'pkg-a','pkg-b') {
            if (Test-Path artifacts) { Remove-Item -Recurse -Force artifacts }
            dotnet publish src/StartApp.App/StartApp.App.csproj -c Release -r win-x64 --self-contained true -p:ContinuousIntegrationBuild=true --artifacts-path artifacts -nr:false -o $out 2>&1 | Tee-Object "diag/publish-$out.txt" | Select-Object -Last 2
            if ($LASTEXITCODE -ne 0) { "publish failed for $out" | Out-File -Append diag/errors.txt }
          }
          if (Test-Path diag/errors.txt) { exit 1 }
      - name: Stamp identical prototype notice and known limits into both payloads
        shell: pwsh
        working-directory: src
        run: |
          $notice = @(
            'PROTOTYPE / אב-טיפוס'
            'This package is a PROTOTYPE build for evaluation only - not a stable or final distribution.'
            'חבילה זו היא אב-טיפוס לצורכי הערכה בלבד - זו אינה הפצה יציבה או סופית.'
            "commit: $env:SHA (version: $env:VERSION)"
          )
          foreach ($out in 'pkg-a','pkg-b') { $notice | Out-File -Encoding utf8 "$out\PROTOTYPE-NOTICE.txt"; Copy-Item ..\trusted\.github\release\KNOWN-LIMITS.txt "$out\KNOWN-LIMITS.txt" }
      - name: Build native portable entry from candidate source
        shell: cmd
        working-directory: src
        run: tools\portable-entry\build.cmd
      - name: Stage portable layout around each intact candidate payload
        shell: pwsh
        run: |
          foreach($suffix in 'a','b') {
            & ./trusted/tools/portable-entry/package.ps1 -Payload "src/pkg-$suffix" -Launcher 'src/portable-build/Start-app.exe' -Destination "src/portable-$suffix"
          }
      - name: Compare payloads (REPORT ONLY, never fails the job)
        shell: pwsh
        working-directory: src
        run: |
          function PayloadHashes($dir) { $root=(Resolve-Path $dir).Path; Get-ChildItem -Recurse -File $dir | Sort-Object FullName | ForEach-Object { $_.FullName.Substring($root.Length) + ':' + (Get-FileHash $_.FullName -Algorithm SHA256).Hash } }
          $diff = Compare-Object (PayloadHashes 'portable-a') (PayloadHashes 'portable-b')
          if ($diff) { 'REPRODUCIBLE=no (same-runner, same-path comparison; report only)' | Tee-Object diag/reproducibility.txt; $diff | Format-Table | Out-String | Tee-Object diag/reproducibility-diff.txt }
          else { 'REPRODUCIBLE=yes (scoped: same runner image, same paths; not a cross-run guarantee)' | Tee-Object diag/reproducibility.txt }
      - name: Build normalized ZIP, hash, BUILDINFO, manifest
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Force cand | Out-Null
          $zipPath = "$PWD\cand\StartApp-win-x64.zip"
          $fs = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::CreateNew)
          $zip = New-Object System.IO.Compression.ZipArchive($fs, [System.IO.Compression.ZipArchiveMode]::Create)
          $epoch = [DateTimeOffset]::new(2026,1,1,0,0,0,[TimeSpan]::Zero)
          $rootA = (Resolve-Path src/portable-a).Path
          $files = @(Get-ChildItem -Force -Recurse -File src/portable-a | ForEach-Object { [pscustomobject]@{ Rel = $_.FullName.Substring($rootA.Length + 1).Replace('\','/'); Path = $_.FullName } })
          $rels = [string[]]@($files | ForEach-Object { $_.Rel }); $keys = [string[]]@($rels.Clone()); [Array]::Sort($keys, [StringComparer]::Ordinal)   # ordinal, culture-independent entry order
          $byRel = @{}; foreach ($f in $files) { $byRel[$f.Rel] = $f.Path }
          foreach ($rel in $keys) {
            $entry = $zip.CreateEntry($rel); $entry.LastWriteTime = $epoch
            $es = $entry.Open(); $s = [System.IO.File]::OpenRead($byRel[$rel]); $s.CopyTo($es); $s.Dispose(); $es.Dispose()
          }
          $zip.Dispose(); $fs.Dispose()
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash StartApp-win-x64.zip" | Out-File -Encoding ascii cand/StartApp-win-x64.zip.sha256
          @(
            "commit: $env:SHA"
            "version: $env:VERSION"
            "run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            "distribution: PROTOTYPE (evaluation only)"
            "sdk: $(dotnet --version)"
            "built-utc: $([DateTime]::UtcNow.ToString('o'))"
            "repro: $((Get-Content src/diag/reproducibility.txt -Raw).Trim())"
            "sha256: $hash"
          ) | Out-File -Encoding utf8 cand/BUILDINFO.txt
          Copy-Item src/diag/reproducibility.txt cand/reproducibility.txt
          python trusted/.github/release/make_manifest.py --dir cand --sha $env:SHA --version $env:VERSION --ui-gate $env:UI_GATE --layout portable
      - name: Verify candidate consistency (verifier)
        shell: pwsh
        run: |
          python trusted/.github/release/verify_candidate.py --dir cand --sha $env:SHA --version $env:VERSION --layout portable
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke-run the ZIP that would ship (FAILURE GATE, smoke script)
        shell: pwsh
        run: |
          Expand-Archive -Path cand/StartApp-win-x64.zip -DestinationPath verify-ship -Force
          pwsh -NoProfile -File trusted/tools/portable-entry/smoke-candidate.ps1 -Extracted verify-ship -EvidenceDirectory portable-evidence -OwnershipHelper trusted/tests/portable-entry/OwnedTree.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portable-candidate-smoke
          retention-days: 1
          if-no-files-found: warn
          path: portable-evidence/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: StartApp-validation-candidate
          retention-days: 5
          if-no-files-found: error
          path: cand/*

# Validation artifacts only. Distribution and main promotion remain separate decisions.
