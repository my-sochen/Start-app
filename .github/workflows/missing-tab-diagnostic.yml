name: missing-tab-diagnostic
on:
  push:
    branches: [fix/capture-continue-on-input]
permissions:
  contents: read
concurrency:
  group: capture-continue-on-input-single
  cancel-in-progress: false
jobs:
  trace-two-scans:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with: { dotnet-version: '10.0.404' }
      - name: Bind source and parse the fixed two-scan harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diag, out-images | Out-Null
          $actual = git rev-parse HEAD
          if ($actual -ne $env:GITHUB_SHA) { throw 'source SHA mismatch' }
          $tree = git rev-parse 'HEAD^{tree}'
          "sha=$actual`ntree=$tree`nrun=$env:GITHUB_RUN_ID`nattempt=$env:GITHUB_RUN_ATTEMPT`nbase=2d4c8fec145f0e41c4f0a252159e6ddc251bee1b`nscope=input-focus-stop removed; not TEST77 replay; synthetic Edge two scans" | Out-File diag/source-binding.txt
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .github/e2e/tabs-only-flow.ps1).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'PowerShell parse failure' }
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .github/e2e/native-capture-policy.ps1).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'Native policy PowerShell parse failure' }
      - name: Local structural policy regression checks
        shell: pwsh
        run: python tests/capture-policy/test_traversal_policy.py
      - name: Build changed traversal policy with existing scalar trace
        shell: pwsh
        run: |
          dotnet build src/StartApp.App/StartApp.App.csproj --configuration Release -p:DefineConstants=STARTAPP_CAPTURE_TRACE 2>&1 | Tee-Object diag/build-app.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing cancellation and capture lifecycle unit tests
        shell: pwsh
        run: |
          dotnet test tests/StartApp.Core.Tests --configuration Release --filter FullyQualifiedName~CaptureScanningTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/StartApp.Presentation.Tests --configuration Release --filter FullyQualifiedName~CaptureAsyncScanTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One fixed initial scan and discard-rescan
        shell: pwsh
        run: pwsh -NoProfile -File .github/e2e/tabs-only-flow.ps1
      - name: Build real native policy fixture with test-only interleaving probes
        shell: pwsh
        run: |
          dotnet build tests/StartApp.NativeCapturePolicy --configuration Release -p:DefineConstants=STARTAPP_CAPTURE_TRACE%3BSTARTAPP_CAPTURE_TEST 2>&1 | Tee-Object diag/build-native-policy.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One fixed six-tab native policy case pass
        shell: pwsh
        run: pwsh -NoProfile -File .github/e2e/native-capture-policy.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: missing-tab-diagnostic-evidence
          path: |
            diag/
            out-images/
          if-no-files-found: error
