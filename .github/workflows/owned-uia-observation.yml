name: Owned topology experiment with separate canonical support report
'on':
  push:
    branches: ['diag/owned-uia-q6']
    paths: ['.github/workflows/owned-uia-observation.yml','qualification/owned-uia/**']
permissions:
  contents: read
concurrency:
  group: owned-uia-q6
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'my-sochen/Start-app' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/diag/owned-uia-q6' && github.run_attempt == 1
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    steps:
      - name: Checkout isolated experiment source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qualification/owned-uia/
      - name: Verify exact entrypoint and syntax before any experiment process
        shell: pwsh
        working-directory: qualification/owned-uia
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or -not $env:ImageOS -or -not $env:ImageVersion){throw 'RUNNER_IDENTITY_STOP'}
          if((Get-Item Preflight.ps1).Length -gt 64KB -or (Get-FileHash Preflight.ps1 -Algorithm SHA256).Hash -cne 'C4DC961A1C0389AEA5E2479943745DF8BA411636F2C75D271CE658756DEAA43F'){throw 'ENTRYPOINT_HASH_STOP'}
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path Preflight.ps1).Path,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw 'PREFLIGHT_PARSE_STOP'}
      - name: Compile separate assemblies then one explicitly scoped owned fixture observation
        timeout-minutes: 4
        shell: pwsh
        working-directory: qualification/owned-uia
        run: ./Preflight.ps1 -ActivateOwnedFixture
      - name: Bound explicit evidence allowlist
        if: always()
        id: evidence
        shell: pwsh
        working-directory: qualification/owned-uia
        run: |
          $ErrorActionPreference='Stop'
          # Do not trust a script from a failed integrity preflight for this upload gate.
          $root='experiment-output'
          if(-not(Test-Path $root -PathType Container)){'No experiment output';exit 0}
          $allowed=@{'observation.json'=64KB;'supervisor.json'=8KB;'compile.txt'=1MB;'inventory.json'=2MB;'build-completion.json'=16KB;'completion.json'=8KB;'launcher-lifecycle.json'=8KB}
          $files=@()
          foreach($name in $allowed.Keys){$path=Join-Path $root $name;if(Test-Path $path -PathType Leaf){if((Get-Item $path).Length -gt $allowed[$name]){throw 'ARTIFACT_CAP_STOP_NO_UPLOAD'};$files+=$path}}
          if($files.Count -eq 0){'No permitted evidence';exit 0}
          'upload=true' >> $env:GITHUB_OUTPUT
      - name: Upload only bounded synthetic evidence, never binaries or scratch
        if: always() && steps.evidence.outputs.upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owned-uia-q6-${{ github.sha }}
          path: |
            qualification/owned-uia/experiment-output/observation.json
            qualification/owned-uia/experiment-output/supervisor.json
            qualification/owned-uia/experiment-output/compile.txt
            qualification/owned-uia/experiment-output/inventory.json
            qualification/owned-uia/experiment-output/build-completion.json
            qualification/owned-uia/experiment-output/completion.json
            qualification/owned-uia/experiment-output/launcher-lifecycle.json
          if-no-files-found: warn
          retention-days: 3
